name: Static download catalog proof

on:
  push:
    branches: ["candidate/t3code-ls-t14-static-download-*"]

permissions:
  contents: read

jobs:
  static-downloads:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 12
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      VP_REMOTE_CACHE: "off"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Install the pinned compiler and frozen site dependencies
        run: |
          node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/marketing-toolchain"
          npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
      - name: Generate release links and verify the emitted localized HTML
        run: |
          export CARGO_HOME="$RUNNER_TEMP/marketing-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/marketing-target"
          lustr="$T3_CODE_LS_TOOLCHAIN/bin/lustr"
          "$lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked -p t3code-ls-tools download_catalog
          "$lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" build --locked -p t3code-ls-tools
          proof="$RUNNER_TEMP/marketing-proof"
          mkdir "$proof"
          catalog="$CARGO_TARGET_DIR/debug/t3code-ls-tools"
          "$catalog" download-catalog > "$proof/catalog.json" <<'JSON'
          {
            "stable": {
              "tag_name": "v42.0.0",
              "assets": [
                {"name": "fixture-arm64.dmg", "browser_download_url": "https://fixture.invalid/wrong"},
                {"name": "fixture-arm64.dmg", "browser_download_url": "https://github.com/pingdotgg/t3code/releases/download/v42.0.0/fixture-arm64.dmg"},
                {"name": "fixture-amd64.deb", "browser_download_url": "https://github.com/pingdotgg/t3code/releases/download/v42.0.0/fixture-amd64.deb"}
              ]
            },
            "nightlies": [{
              "tag_name": "v43.0.0-nightly.1",
              "assets": [
                {"name": "fixture-arm64.dmg", "browser_download_url": "https://github.com/pingdotgg/t3code/releases/download/v43.0.0-nightly.1/fixture-arm64.dmg"}
              ]
            }]
          }
          JSON
          T3_CODE_LS_MARKETING_RELEASE_CATALOG="$proof/catalog.json" pnpm --filter @t3tools/marketing build
          assert_href() {
            local target="$1" href="$2" page="$3"
            grep -Eo '<a[[:space:]][^>]*>' "$page" |
              grep -F "data-asset=\"$target\"" |
              grep -F "href=\"$href\"" > /dev/null
          }
          downloads=()
          for locale in "" es/ zh/ pt-br/ fr/ de/ ja/ ko/ ru/; do
            page="apps/marketing/dist/${locale}download/index.html"
            assert_href arm64.dmg https://github.com/pingdotgg/t3code/releases/download/v42.0.0/fixture-arm64.dmg "$page"
            assert_href amd64.deb https://github.com/pingdotgg/t3code/releases/download/v42.0.0/fixture-amd64.deb "$page"
            assert_href x64.exe https://github.com/pingdotgg/t3code/releases "$page"
            grep -Fq 'data-nightly-download="https://github.com/pingdotgg/t3code/releases/download/v43.0.0-nightly.1/fixture-arm64.dmg"' "$page"
            if grep -Fq 'https://fixture.invalid/wrong' "$page"; then exit 1; fi
            downloads+=("$page")
          done
          sha256sum "${downloads[@]}" > "$proof/html.sha256"
          printf '{}' | "$catalog" download-catalog > "$proof/unavailable.json"
          T3_CODE_LS_MARKETING_RELEASE_CATALOG="$proof/unavailable.json" pnpm --filter @t3tools/marketing build
          for page in "${downloads[@]}"; do
            assert_href arm64.dmg https://github.com/pingdotgg/t3code/releases "$page"
            if grep -Fq 'fixture-arm64.dmg' "$page"; then exit 1; fi
          done
      - name: Retain generated catalog and artifact identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marketing-download-proof
          path: ${{ runner.temp }}/marketing-proof/
          if-no-files-found: warn
          retention-days: 14
