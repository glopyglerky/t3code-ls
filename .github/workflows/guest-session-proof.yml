name: Native guest session eligibility

on:
  push:
    branches: ["candidate/t3code-ls-t10-guest-session-*"]

permissions:
  contents: read

jobs:
  guest-session:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 12
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      GIT_TERMINAL_PROMPT: "0"
      T3_CODE_LS_IMPLEMENTATION: upstream
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Install the pinned compiler and locked adapter runtime
        run: |
          set -euo pipefail
          node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/guest-session-toolchain"
          export T3_CODE_LS_TEST_RUNTIME="$RUNNER_TEMP/guest-session-runtime"
          node tools/install-server-tests.mjs
          printf 'T3_CODE_LS_TEST_RUNTIME=%s\n' "$T3_CODE_LS_TEST_RUNTIME" >> "$GITHUB_ENV"
          upstream_commit="$(node -p 'JSON.parse(require("node:fs").readFileSync("upstream.lock.json", "utf8")).upstream.commit')"
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 https://github.com/pingdotgg/t3code.git "$upstream_commit"
      - name: Exercise guest session decisions and the native GuestHttp route
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/guest-session-cargo"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/guest-session-target"
          proof="$RUNNER_TEMP/guest-session-proof"
          mkdir "$proof"
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test \
            --locked -p t3-code-ls-core --lib session_eligibility_requires_the_claimed_live_share_and_thread
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test \
            --locked -p t3-code-ls-core --lib session_operation_requires_typed_complete_facts
          node tools/check-acceptance.mjs --tests '["tools/check-omdb-production.mjs"]' \
            --proof-directory "$proof/production"
          "$T3_CODE_LS_TEST_RUNTIME/node_modules/.bin/effect-tsgo" tsrs --noEmit \
            --project tools/guest-share-tsconfig.json > "$proof/guest-typecheck.log" 2>&1 || {
              cat "$proof/guest-typecheck.log"
              exit 1
            }
          node tools/check-guest-share-adapter.mjs "$CARGO_TARGET_DIR/debug/t3-code-ls-guest-share" \
            "$proof/adapter.json"
      - name: Retain native guest session evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guest-session-proof
          path: ${{ runner.temp }}/guest-session-proof/
          if-no-files-found: warn
          retention-days: 14
