          cat "$RUNNER_TEMP/omdb-types.log"
          exit "$status"
      - name: Retain the full TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: omdb-types
          path: ${{ runner.temp }}/omdb-types.log
