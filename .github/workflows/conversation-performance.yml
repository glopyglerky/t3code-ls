name: Paired conversation measurement

on:
  push:
    branches: ["measure/t3code-ls-t16-conversation-*"]

permissions:
  contents: read

jobs:
  conversation:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      STOCK_COMMIT: 28706aceb6fb3babf2cbae0dc0c3edd93b9b6d5f
      STOCK_TREE: af9112ce82be93109079ca7b7a89f7182455eca5
      COMPOSED_J06: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-') }}
      LAUNCH_RECEIPT_COMPARISON: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-launch-receipt-') }}
      BATCH_TURN_START_COMPARISON: ${{ (startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-turn-start-batch-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-turn-start-batch-')) }}
      J06_FORK_SQLITE_COMPARISON: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-fork-sqlite-') }}
      J06_NATIVE_READER_COMPARISON: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-native-reader-') }}
      LIGHTWEIGHT_RESPONSE_COMPARISON: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-lightweight-response-') }}
      CANDIDATE_COMMIT: ${{ ((startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-turn-start-batch-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-turn-start-batch-')) || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-native-reader-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-fork-sqlite-')) && '134c97974f287cfb4a76402dc12eb2cf2dc47933' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-lightweight-response-') && '14671e4314fa982fed480e4636141bc11431bba2' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-launch-receipt-') && '951537f189353748fa6bdb3f936fd716b9c86d18' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-') && 'd3217d6c0176faad753f8ce2525cc2552fe502d7' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-lookup-once-') && '7216183e0c013c7f5d7e9975d8aee7beda42b880' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-independent-reads-') && '08eadccbff571219466f7bc35e982730295f15d8' || (startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-single-reads-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-root-release-')) && '9201e4b80c5b13503ce4763a296a7294c0bada7d' || 'c8e1245f85f48699f91de99e749635d8d06c2c6e' }}
      CANDIDATE_TREE: ${{ ((startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-turn-start-batch-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-turn-start-batch-')) || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-native-reader-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-fork-sqlite-')) && '65e88524d4104c972fafdb2f30e7dafd0fbcca91' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-lightweight-response-') && 'aa4bd4013148d3d024c5f29338e99b79bfc337a1' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-launch-receipt-') && 'bf42c79d73bc46a39c6c41e71084bfd140fc7c7f' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-') && '0bf400e6b6884ce602e9cb1cd094abe437e1c62f' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-lookup-once-') && '675636c7feb22a55179fa726af94e5cfa49212b8' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-independent-reads-') && '38ff3e9ac680e4defe3d06fcfb3e79d0b94b841c' || (startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-single-reads-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-root-release-')) && '78647c8e507b6b677fa6f1585839bd8bdc12bc55' || '0c88f18ec4f3e7e9d13e419f6694d75bb548fc8a' }}
      CATALOG_COMMIT: 2bb6ae9e57559bde6cff0feeddcff8ddf02de009
      CATALOG_TREE: 55e2c8aba6fc06642b06a8d60861c7bdaf3c67f9
      ROOT_RELEASE_COMMIT: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-lightweight-response-') && 'c29e9d9ed8e975ea658e55f40e8316e8294c5a13' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-launch-receipt-') && '143ee1ffe940cf519b1d55bc988beaa441f82599' || 'a7ca741bd4c4d508fef316e164fb1ae897301965' }}
      ROOT_RELEASE_TREE: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-lightweight-response-') && 'd28cf2166780c0ce6cd5bedda55b5b2e1972dd18' || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-launch-receipt-') && 'af6df769479d59648c84be59a5d9b651f257e108' || '3458897fed59a6a500ed14edecc0e17f0d41707b' }}
      WASM_BINDGEN_VERSION: "0.2.130"
      WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      GIT_TERMINAL_PROMPT: "0"
      TRACE_CONVERSATION: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-lookup-once-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-diagnose-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-catalog-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-single-reads-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-independent-reads-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-root-release-') }}
      J06_ATTRIBUTION: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-attribution-') }}
      TRACE_SERVER_SPANS: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-diagnose-server-') }}
      COMPARE_CATALOG: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-catalog-') }}
      COMPARE_SINGLE_READS: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-single-reads-') }}
      COMPARE_INDEPENDENT_READS: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-lookup-once-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-independent-reads-') }}
      COMPARE_INDEPENDENT_LOOKUPS: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-lookup-once-') }}
      COMPARE_ROOT_RELEASE: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-lightweight-response-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-root-release-') || startsWith(github.ref_name, 'measure/t3code-ls-t16-conversation-composed-j06-launch-receipt-') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: measurement
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Fetch and verify the frozen source trees
        run: |
          for profile in stock candidate; do
            git init "$profile"
            if [[ "$profile" == stock ]]; then
              repository=https://github.com/pingdotgg/t3code.git
              commit="$STOCK_COMMIT"
              tree="$STOCK_TREE"
            else
              repository=https://github.com/glopyglerky/t3code-ls.git
              commit="$CANDIDATE_COMMIT"
              tree="$CANDIDATE_TREE"
            fi
            git -C "$profile" fetch --no-tags --depth=1 "$repository" "$commit"
            git -C "$profile" checkout --detach --no-recurse-submodules FETCH_HEAD
            test "$(git -C "$profile" rev-parse HEAD)" = "$commit"
            test "$(git -C "$profile" rev-parse 'HEAD^{tree}')" = "$tree"
          done
          if [[ "$COMPARE_CATALOG" == true ]]; then
            git -C candidate fetch --no-tags --depth=1 https://github.com/glopyglerky/t3code-ls.git "$CATALOG_COMMIT"
            test "$(git -C candidate rev-parse 'FETCH_HEAD^{tree}')" = "$CATALOG_TREE"
            git -C candidate worktree add --detach "$GITHUB_WORKSPACE/catalog" "$CATALOG_COMMIT"
            git -C candidate diff --name-only "$CANDIDATE_COMMIT" "$CATALOG_COMMIT" > "$RUNNER_TEMP/catalog-source-diff"
            printf '%s\n' apps/server/src/persistence/redb_transactions{,_tests}.rs | diff - "$RUNNER_TEMP/catalog-source-diff"
          fi
          if [[ "$COMPARE_ROOT_RELEASE" == true ]]; then
            git -C candidate fetch --no-tags --depth=1 https://github.com/glopyglerky/t3code-ls.git "$ROOT_RELEASE_COMMIT"
            test "$(git -C candidate rev-parse 'FETCH_HEAD^{tree}')" = "$ROOT_RELEASE_TREE"
            git -C candidate worktree add --detach "$GITHUB_WORKSPACE/root-release" "$ROOT_RELEASE_COMMIT"
            git -C candidate diff --exit-code "$CANDIDATE_COMMIT" "$ROOT_RELEASE_COMMIT" -- \
              Cargo.lock pnpm-lock.yaml toolchain.lock.json database.lock.json ':(glob)**/*.rs' ':(glob)**/Cargo.toml' tools/build-native.mjs tools/native-artifacts.mjs tools/install-toolchain.mjs
            if [[ "$LIGHTWEIGHT_RESPONSE_COMPARISON" == true ]]; then
              test "$(git -C root-release rev-parse HEAD)" = "$ROOT_RELEASE_COMMIT"
              git -C candidate diff --name-only "$ROOT_RELEASE_COMMIT" "$CANDIDATE_COMMIT" \
                > "$RUNNER_TEMP/lightweight-response-source-diff"
              cat <<'EXPECTED' | diff - "$RUNNER_TEMP/lightweight-response-source-diff"
          .github/workflows/composer-offsets.yml
          apps/server/scripts/verify-gpui-thread-submit.ts
          apps/server/scripts/verify-packaged-guest-authorization.ts
          apps/server/scripts/verify-scheduled-relay-recovery.ts
          apps/server/src/mcp/linkOrigin.test.ts
          apps/server/src/orchestration-v2/ThreadLaunchService.test.ts
          apps/server/src/orchestration-v2/ThreadLaunchService.ts
          apps/server/src/orchestration-v2/ThreadMessageIntake.ts
          apps/server/src/ws.ts
          apps/web/scripts/hybrid-client-database.ts
          apps/web/scripts/verify-hybrid-client.ts
          packages/client-runtime/src/operations/commands.test.ts
          packages/client-runtime/src/operations/commands.ts
          packages/contracts/src/orchestrationV2.test.ts
          packages/contracts/src/orchestrationV2.ts
          tools/launch-receipt-tsconfig.json
          EXPECTED
            fi
            if [[ "$LAUNCH_RECEIPT_COMPARISON" == true ]]; then
              test "$(git -C root-release rev-parse HEAD)" = "$ROOT_RELEASE_COMMIT"
              git -C candidate diff --name-only "$CANDIDATE_COMMIT" "$ROOT_RELEASE_COMMIT" \
                > "$RUNNER_TEMP/launch-receipt-source-diff"
              printf '%s\n' apps/server/src/orchestration-v2/ThreadLaunchService{.test,}.ts \
                | diff - "$RUNNER_TEMP/launch-receipt-source-diff"
            fi
          fi
          npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
      - name: Build the optimized stock bundle
        working-directory: stock
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web run build
          pnpm --dir apps/server run build:bundle
      - name: Install the pinned compiler for the candidate and probe
        working-directory: measurement
        run: node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/conversation-toolchain"
      - name: Build the native server and Rust composer bundle
        working-directory: candidate
        run: |
          export CARGO_HOME="$RUNNER_TEMP/conversation-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/conversation-target"
          pnpm install --frozen-lockfile
          lustr="$T3_CODE_LS_TOOLCHAIN/bin/lustr"
          "$lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" build \
            --release --locked --target wasm32-unknown-unknown -p t3-code-ls-client-text-web
          archive="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$archive.tar.gz"
          printf '%s  %s\n' "$WASM_BINDGEN_SHA256" "$RUNNER_TEMP/$archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -O "$archive/wasm-bindgen" > "$RUNNER_TEMP/wasm-bindgen"
          chmod u+x "$RUNNER_TEMP/wasm-bindgen"
          "$RUNNER_TEMP/wasm-bindgen" --target web --out-name composer_offsets \
            --out-dir apps/web/public/client-text-wasm \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/t3_code_ls_client_text_web.wasm"
          VITE_T3_CODE_LS_COMPOSER_OFFSETS=rust pnpm --dir apps/web run build
          T3_CODE_LS_IMPLEMENTATION=native node tools/build-native.mjs
          node tools/check-hybrid.mjs --verify-binaries
          T3_CODE_LS_IMPLEMENTATION=native T3_CODE_LS_NATIVE_DIR="$PWD/bin" \
            pnpm --dir apps/server run build:bundle
      - name: Build the catalog variant with the same packaged client and server
        if: env.COMPARE_CATALOG == 'true'
        working-directory: catalog
        run: |
          export CARGO_HOME="$RUNNER_TEMP/conversation-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/conversation-target"
          target=x86_64-unknown-linux-gnu
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" build \
            --release --locked --target "$target" -p t3-code-ls-storage --bin t3-code-ls-db
          cp -a ../candidate/apps/web/dist apps/web/dist
          cp -a ../candidate/apps/server/dist apps/server/dist
          ln -s "$GITHUB_WORKSPACE/candidate/node_modules" node_modules
          ln -s "$GITHUB_WORKSPACE/candidate/apps/server/node_modules" apps/server/node_modules
          helpers=apps/server/dist/native-bin
          install -m 755 "$CARGO_TARGET_DIR/$target/release/t3-code-ls-db" "$helpers/t3-code-ls-db"
          digest="$(sha256sum "$helpers/t3-code-ls-db" | cut -d ' ' -f 1)"
          jq --arg digest "$digest" '.files["t3-code-ls-db"] = $digest' \
            "$helpers/manifest.json" > "$helpers/manifest.next.json"
          mv "$helpers/manifest.next.json" "$helpers/manifest.json"
          node --input-type=module -e 'import {nativeArtifactFiles} from "./tools/native-artifacts.mjs"; nativeArtifactFiles(process.argv[1], "linux-x64");' "$helpers"
          diff -qr ../candidate/apps/web/dist apps/web/dist
          diff -qr --exclude=native-bin ../candidate/apps/server/dist apps/server/dist
      - name: Build the root release variant with identical Rust artifacts
        if: env.COMPARE_ROOT_RELEASE == 'true'
        working-directory: root-release
        run: |
          pnpm install --frozen-lockfile
          if [[ "$LAUNCH_RECEIPT_COMPARISON" == true || "$LIGHTWEIGHT_RESPONSE_COMPARISON" == true ]]; then
            cp -a ../candidate/apps/web/dist apps/web/dist
            diff -qr ../candidate/apps/web/dist apps/web/dist
          else
            cp -a ../candidate/apps/web/public/client-text-wasm apps/web/public/client-text-wasm
            VITE_T3_CODE_LS_COMPOSER_OFFSETS=rust pnpm --dir apps/web run build
          fi
          T3_CODE_LS_IMPLEMENTATION=native T3_CODE_LS_NATIVE_DIR="$GITHUB_WORKSPACE/candidate/bin" \
            pnpm --dir apps/server run build:bundle
          diff -qr ../candidate/apps/server/dist/native-bin apps/server/dist/native-bin
      - name: Measure completed fixture turns in alternating order
        shell: bash
        run: |
          export CARGO_HOME="$RUNNER_TEMP/conversation-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/conversation-target"
          cd measurement
          if [[ "$COMPOSED_J06" == true ]]; then node tools/src/startup_probe/browser/conversation-probe.test.mjs; fi
          if [[ "$BATCH_TURN_START_COMPARISON" == true && "$J06_ATTRIBUTION" != true ]]; then
            "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test \
              --locked -p t3code-ls-tools --bin t16-j06-budget
          fi
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" build \
            --release --locked -p t3code-ls-tools
          cd ..
          node_path="$(command -v node)"
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver || printf '%s/chromedriver' "$CHROMEWEBDRIVER")"
          test -x "$driver"
          probe="$CARGO_TARGET_DIR/release/t3code-ls-tools"
          replay="$PWD/stock/apps/server/scripts/dev-replay-agent.ts"
          transcript=apps/server/src/orchestration-v2/testkit/fixtures/todo_list/registry_transcript.ndjson
          evidence="$RUNNER_TEMP/conversation-evidence"
          mkdir "$evidence"
          printf '%s  %s\n' 560623d69777188138a1d9a7fbc0cc994f4067eb2a7d30ae113b0667456ec45e \
            "stock/$transcript" | sha256sum --check
          sha256sum "$probe" "$replay" "stock/$transcript" > "$evidence/fixture.sha256"
          trace=()
          pairs=8
          if [[ "$TRACE_CONVERSATION" == true || "$J06_ATTRIBUTION" == true ]]; then
            trace=("$PWD/measurement/tools/src/startup_probe/browser/conversation-provider-trace.mjs")
            sha256sum "${trace[0]}" >> "$evidence/fixture.sha256"
            pairs=6
            if [[ "$TRACE_SERVER_SPANS" == true || "$J06_ATTRIBUTION" == true ]]; then
              trace+=(server-spans)
              pairs=3
            fi
          fi
          bundles=(stock candidate)
          if [[ "$COMPARE_CATALOG" == true ]]; then
            bundles+=(catalog)
            pairs=8
          fi
          if [[ "$COMPARE_SINGLE_READS" == true || "$COMPARE_INDEPENDENT_READS" == true ]]; then pairs=8; fi
          if [[ "$COMPARE_ROOT_RELEASE" == true ]]; then bundles+=(root-release); pairs=8; fi
          orders=(
            'stock candidate root-release' 'stock root-release candidate'
            'candidate stock root-release' 'candidate root-release stock'
            'root-release stock candidate' 'root-release candidate stock'
          )
          if [[ "$BATCH_TURN_START_COMPARISON" == true || "$J06_NATIVE_READER_COMPARISON" == true || "$J06_FORK_SQLITE_COMPARISON" == true ]]; then
            comparison=turn-start-batch
            if [[ "$J06_NATIVE_READER_COMPARISON" == true ]]; then comparison=independent-reads; fi
            if [[ "$J06_FORK_SQLITE_COMPARISON" == true ]]; then comparison=fork-sqlite; fi
            orders=(
              "stock candidate $comparison" "stock $comparison candidate"
              "candidate stock $comparison" "candidate $comparison stock"
              "$comparison stock candidate" "$comparison candidate stock"
            )
          fi
          if [[ "$LAUNCH_RECEIPT_COMPARISON" == true || "$LIGHTWEIGHT_RESPONSE_COMPARISON" == true || "$BATCH_TURN_START_COMPARISON" == true || "$J06_NATIVE_READER_COMPARISON" == true || "$J06_FORK_SQLITE_COMPARISON" == true ]]; then pairs="${#orders[@]}"; fi
          for profile in "${bundles[@]}"; do
            (
              cd "$profile"
              sha256sum pnpm-lock.yaml
              find apps/web/dist apps/server/dist -type f -print0 | sort -z | xargs -0 -r sha256sum
            ) > "$evidence/$profile.sha256"
          done
          jq -n --arg stock "$STOCK_COMMIT" --arg stockTree "$STOCK_TREE" \
            --arg candidate "$CANDIDATE_COMMIT" --arg candidateTree "$CANDIDATE_TREE" \
            --arg catalog "$CATALOG_COMMIT" --arg catalogTree "$CATALOG_TREE" --argjson compareCatalog "$COMPARE_CATALOG" \
            --argjson compareSingleReads "$COMPARE_SINGLE_READS" \
            --argjson compareIndependentLookups "$COMPARE_INDEPENDENT_LOOKUPS" \
            --argjson compareIndependentReads "$COMPARE_INDEPENDENT_READS" \
            --argjson composedNativeReader "$J06_NATIVE_READER_COMPARISON" \
            --argjson composedForkSqlite "$J06_FORK_SQLITE_COMPARISON" \
            --arg rootRelease "$ROOT_RELEASE_COMMIT" --arg rootReleaseTree "$ROOT_RELEASE_TREE" --argjson compareRootRelease "$COMPARE_ROOT_RELEASE" \
            --argjson attribution "$J06_ATTRIBUTION" --arg probe "$(git -C measurement rev-parse HEAD)" --arg node "$(node --version)" \
            --arg chrome "$("$chrome" --version)" --arg driver "$("$driver" --version)" \
            --arg image "${ImageOS:-unknown}/${ImageVersion:-unknown}" --arg kernel "$(uname -r)" \
            --arg cpu "$(LC_ALL=C lscpu | sed -n 's/^Model name:[[:space:]]*//p')" --argjson trace "$TRACE_CONVERSATION" \
            --argjson composedJ06 "$COMPOSED_J06" \
            --argjson lightweightResponseComparison "$LIGHTWEIGHT_RESPONSE_COMPARISON" \
            --argjson launchReceiptComparison "$LAUNCH_RECEIPT_COMPARISON" \
            --arg systemLoad "$(uptime)" --argjson cpus "$(nproc)" \
            '{attribution:$attribution,composedJ06:$composedJ06,launchReceiptComparison:$launchReceiptComparison,lightweightResponseComparison:$lightweightResponseComparison,responseRoles:(if $lightweightResponseComparison then {candidate:"receipt",rootRelease:"legacy-projection",stock:"legacy-projection"} else null end),acceptBoundary:(if $composedJ06 then "browser launch acknowledgement upper bound; observer overhead included" else null end),stock:{commit:$stock,tree:$stockTree,durability:"SQLite WAL/NORMAL"},candidate:{commit:$candidate,tree:$candidateTree,durability:"omdb Immediate"},catalog:(if $compareCatalog then {commit:$catalog,tree:$catalogTree,durability:"omdb Immediate"} else null end),rootRelease:(if $compareRootRelease then {commit:$rootRelease,tree:$rootReleaseTree,durability:"omdb Immediate"} else null end),singleProjectionReads:$compareSingleReads,independentReads:($compareIndependentReads or $composedNativeReader),independentLookups:$compareIndependentLookups,forkSqliteControl:($trace or $composedForkSqlite),forkSqlite:(if $composedForkSqlite then {bundle:"candidate",commit:$candidate,tree:$candidateTree,durability:"SQLite WAL/NORMAL"} else null end),providerTrace:($trace or $attribution),probe:$probe,node:$node,chrome:$chrome,driver:$driver,image:$image,kernel:$kernel,cpu:$cpu,systemLoad:$systemLoad,cpus:$cpus,cache:"fresh profile and browser per turn, unmanaged filesystem cache"}' \
            > "$evidence/inputs.json"
          if [[ "$BATCH_TURN_START_COMPARISON" == true && "$J06_ATTRIBUTION" != true ]]; then
            "$CARGO_TARGET_DIR/release/t16-j06-budget" policy > "$evidence/j06-policy.json"
            sha256sum "$CARGO_TARGET_DIR/release/t16-j06-budget" > "$evidence/j06-budget.sha256"
          fi
          printf 'pair\tposition\tprofile\tfirst_visible_ms\tterminal_ms\tmax_frame_gap_ms\n' > "$evidence/trials.tsv"
          if [[ "$COMPOSED_J06" == true ]]; then
            printf 'pair\tposition\tprofile\taccept_ack_ms\tfirst_visible_ms\tterminal_ms\tmax_frame_gap_ms\tbrowser_reload_us\n' > "$evidence/j06.tsv"
          fi
          for ((pair=1; pair<=pairs; pair++)); do
            profiles=(stock candidate)
            if (( pair % 2 == 0 )); then profiles=(candidate stock); fi
            if [[ "$TRACE_CONVERSATION" == true ]]; then profiles=(stock candidate fork-sqlite); fi
            if [[ "$COMPARE_CATALOG" == true ]]; then profiles+=(catalog); fi
            if [[ "$COMPARE_SINGLE_READS" == true ]]; then profiles+=(single-reads); fi
            if [[ "$COMPARE_INDEPENDENT_READS" == true ]]; then profiles+=(independent-reads); fi
            if [[ "$COMPARE_INDEPENDENT_LOOKUPS" == true ]]; then profiles+=(independent-lookups); fi
            if [[ "$COMPARE_ROOT_RELEASE" == true ]]; then profiles+=(root-release); fi
            if [[ "$LAUNCH_RECEIPT_COMPARISON" == true || "$LIGHTWEIGHT_RESPONSE_COMPARISON" == true || "$BATCH_TURN_START_COMPARISON" == true || "$J06_NATIVE_READER_COMPARISON" == true || "$J06_FORK_SQLITE_COMPARISON" == true ]]; then
              read -r -a profiles <<< "${orders[pair - 1]}"
            fi
            for ((position=0; position<${#profiles[@]}; position++)); do
              index="$position"
              if [[ "$TRACE_CONVERSATION" == true ]]; then index="$(((position + pair - 1) % ${#profiles[@]}))"; fi
              profile="${profiles[$index]}"
              trial="$pair-$profile"
              result="$evidence/sample-$trial.json"
              mode=stock
              bundle_profile="$profile"
              if [[ "$profile" == candidate || "$profile" == catalog || "$profile" == root-release ]]; then mode=native; fi
              if [[ "$profile" == fork-sqlite ]]; then mode=fork-sqlite; bundle_profile=candidate; fi
              if [[ "$profile" == single-reads ]]; then mode=native-single-reads; bundle_profile=candidate; fi
              if [[ "$profile" == independent-reads ]]; then mode=native-independent-reads; bundle_profile=candidate; fi
              if [[ "$profile" == independent-lookups ]]; then mode=native-independent-lookups; bundle_profile=candidate; fi
              if [[ "$COMPOSED_J06" == true ]]; then
                if [[ "$profile" == stock ]]; then mode=stock-j06; else mode=native-j06; fi
                if [[ "$profile" == turn-start-batch ]]; then mode=native-j06-turn-start-batch; bundle_profile=candidate; fi
                if [[ "$profile" == independent-reads ]]; then mode=native-j06-independent-reads; bundle_profile=candidate; fi
                if [[ "$profile" == fork-sqlite ]]; then mode=fork-sqlite-j06; bundle_profile=candidate; fi
                if [[ "$J06_ATTRIBUTION" == true ]]; then mode="$mode-attribution"; fi
              fi
              sudo -n unshare --net -- bash -euc '
                ip link set dev lo up
                user="$1"
                shift
                exec runuser -u "$user" -- "$@"
              ' _ "$(id -un)" "$probe" probe-conversation "$node_path" \
                "$PWD/$bundle_profile/apps/server/dist/bin.mjs" "$RUNNER_TEMP/conversation-trial-$trial" \
                "$driver" "$chrome" "$replay" "$mode" "${trace[@]}" | tee "$result" > /dev/null
              if [[ "$LIGHTWEIGHT_RESPONSE_COMPARISON" == true || "$BATCH_TURN_START_COMPARISON" == true || "$J06_NATIVE_READER_COMPARISON" == true || "$J06_FORK_SQLITE_COMPARISON" == true ]]; then
                jq -e --arg profile "$profile" '
                  .browser.conversation.acceptance as $ack |
                  .batch_turn_start_context == ($profile == "turn-start-batch") and
                  .profile == (if $profile == "fork-sqlite" then "new-fork-linux-browser-profile"
                    elif $profile == "stock" then "new-stock-linux-browser-profile" else "new-native-linux-browser-profile" end) and
                  $ack.requests == 1 and $ack.error == null and
                  $ack.result.requestResponseMode == (if $profile == "stock" then null else "receipt" end) and
                  $ack.result.responseKind == (if $profile == "stock" or $profile == "root-release" then "projection" else "receipt" end) and
                  $ack.result.ackValueBytes > 0 and $ack.result.ackExitBytes > $ack.result.ackValueBytes
                ' "$result" > /dev/null
              fi
              if [[ "$COMPOSED_J06" == true ]]; then
                jq -er --argjson pair "$pair" --argjson position "$((position + 1))" --arg profile "$profile" '
                  select(.scoped_j06 and (.single_projection_reads | not) and .independent_reads == ($profile == "independent-reads") and .accept_observer == "browser-websocket-launch-ack-upper-bound" and
                    .browser.loaded_rust_composer == ($profile != "stock") and
                    .browser.conversation.snapshot.valid and
                    .browser.conversation.acceptance.requests == 1 and
                    .browser.conversation.acceptance.error == null and
                    .browser.conversation.acceptance.result.sequence > 0 and
                    .browser.conversation.submit_to_accept_ack_millis > 0 and
                    .browser.conversation.browser_reload_micros > 0 and
                    .browser.conversation.stored_work == .browser.conversation.reopened_work) |
                  .browser.conversation | [$pair,$position,$profile,.submit_to_accept_ack_millis,
                    .timing.firstVisibleMillis,.timing.terminalMillis,.timing.maxFrameGapMillis,.browser_reload_micros] | @tsv' \
                  "$result" >> "$evidence/j06.tsv"
              else
              jq -er --argjson pair "$pair" --argjson position "$((position + 1))" --arg profile "$profile" \
                'select(.single_projection_reads == ($profile == "single-reads" or $profile == "independent-lookups") and .independent_reads == ($profile == "independent-reads" or $profile == "independent-lookups") and .browser.loaded_rust_composer == ($profile != "stock") and .browser.conversation.snapshot.valid) | .browser.conversation.timing | [$pair,$position,$profile,.firstVisibleMillis,.terminalMillis,.maxFrameGapMillis] | @tsv' \
                "$result" >> "$evidence/trials.tsv"
              fi
              rm -r "$RUNNER_TEMP/conversation-trial-$trial"
            done
            for profile in "${profiles[@]}"; do
              if [[ "$profile" == stock ]]; then continue; fi
              if [[ "$COMPOSED_J06" == true ]]; then
                diff <(jq -c '.browser.conversation.stored_work' "$evidence/sample-$pair-stock.json") \
                  <(jq -c '.browser.conversation.stored_work' "$evidence/sample-$pair-$profile.json")
              fi
              diff <(jq -c '.browser.conversation.snapshot.assistant' "$evidence/sample-$pair-stock.json") \
                <(jq -c '.browser.conversation.snapshot.assistant' "$evidence/sample-$pair-$profile.json")
            done
          done
          if [[ "$BATCH_TURN_START_COMPARISON" == true || "$J06_NATIVE_READER_COMPARISON" == true || "$J06_FORK_SQLITE_COMPARISON" == true ]]; then
            for profile in stock candidate; do
              (cd "$profile" && sha256sum --check --quiet "$evidence/$profile.sha256")
            done
            if [[ "$J06_ATTRIBUTION" != true ]]; then
              "$CARGO_TARGET_DIR/release/t16-j06-budget" judge "$evidence/j06.tsv" \
                > "$evidence/j06-budget.json"
            fi
          fi
      - name: Retain exact artifacts and matched observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conversation-evidence
          path: ${{ runner.temp }}/conversation-evidence/
          if-no-files-found: warn
          retention-days: 30
