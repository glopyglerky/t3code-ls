name: Stock startup measurement

on:
  push:
    branches: ["measure/t3code-ls-t00-stock-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-startup:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      STOCK_COMMIT: 28706aceb6fb3babf2cbae0dc0c3edd93b9b6d5f
      STOCK_TREE: af9112ce82be93109079ca7b7a89f7182455eca5
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: measurement
          persist-credentials: false
      - name: Fetch the pinned stock source without submodule setup
        run: |
          git init stock
          git -C stock fetch --no-tags --depth=1 https://github.com/pingdotgg/t3code.git "$STOCK_COMMIT"
          git -C stock checkout --detach --no-recurse-submodules FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
      - name: Verify the stock source and install its locked dependencies
        working-directory: stock
        run: |
          test "$(git rev-parse HEAD)" = "$STOCK_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$STOCK_TREE"
          npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
      - name: Build the stock web client and server bundle
        working-directory: stock
        run: |
          pnpm --dir apps/web run build
          pnpm --dir apps/server run build:bundle
      - name: Verify the pinned compiler package for the measurement tool
        working-directory: measurement
        run: node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/stock-probe-toolchain"
      - name: Sample built server startup and first authenticated workspace
        working-directory: measurement
        run: |
          export CARGO_HOME="$RUNNER_TEMP/stock-probe-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/stock-probe-target"
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver || printf '%s/chromedriver' "$CHROMEWEBDRIVER")"
          test -x "$driver"
          evidence="$RUNNER_TEMP/stock-startup-evidence"
          mkdir "$evidence"
          (
            cd ../stock
            sha256sum pnpm-lock.yaml
            find apps/web/dist apps/server/dist -type f -print0 | sort -z | xargs -0 -r sha256sum
          ) > "$evidence/build.sha256"
          jq -n --arg commit "$STOCK_COMMIT" --arg tree "$STOCK_TREE" \
            --arg probe_commit "$(git rev-parse HEAD)" --arg node "$(node --version)" \
            --arg chrome "$("$chrome" --version)" --arg driver "$("$driver" --version)" \
            --arg image "${ImageOS:-unknown}/${ImageVersion:-unknown}" --arg kernel "$(uname -r)" \
            --arg cpu "$(LC_ALL=C lscpu | sed -n 's/^Model name:[[:space:]]*//p')" \
            --arg platform "$(uname -sm)" --arg load "$(uptime)" --argjson cores "$(nproc)" \
            '{commit:$commit,tree:$tree,probe_commit:$probe_commit,node:$node,chrome:$chrome,driver:$driver,platform:$platform,image:$image,kernel:$kernel,cpu:$cpu,initial_load:$load,cores:$cores,cache_profile:"fresh server and profile, headless browser launched before server, unmanaged filesystem cache",durability:"SQLite WAL/NORMAL"}' \
            > "$evidence/inputs.json"
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" build \
            --release --locked -p t3code-ls-tools
          node_path="$(command -v node)"
          probe="$CARGO_TARGET_DIR/release/t3code-ls-tools"
          sha256sum "$probe" > "$evidence/probe.sha256"
          printf 'batch\tpair\torder\tlabel\tworkspace_micros\n' > "$evidence/trials.tsv"
          for batch in 1 2; do
            for pair in 1 2 3 4 5 6 7; do
              if (( (batch + pair) % 2 == 0 )); then
                labels=(a b)
              else
                labels=(b a)
              fi
              for position in 0 1; do
                label="${labels[$position]}"
                trial="$batch-$pair-$label"
                result="$evidence/sample-$trial.json"
                "$probe" probe-startup "$node_path" ../stock/apps/server/dist/bin.mjs \
                  "$RUNNER_TEMP/stock-trial-$trial" "$driver" "$chrome" > "$result"
                micros="$(jq -er 'select(.descriptor_micros > 0 and
                  .html_micros >= .descriptor_micros and .browser.authenticated and
                  .browser.welcome_micros >= .html_micros and
                  .browser.workspace_micros >= .browser.welcome_micros) | .browser.workspace_micros' "$result")"
                printf '%s\t%s\t%s\t%s\t%s\n' "$batch" "$pair" "$((position + 1))" "$label" "$micros" >> "$evidence/trials.tsv"
              done
            done
          done
      - name: Retain stock startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stock-startup-evidence
          path: ${{ runner.temp }}/stock-startup-evidence/
          if-no-files-found: warn
          retention-days: 30
