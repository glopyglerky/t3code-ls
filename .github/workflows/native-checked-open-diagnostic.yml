name: Native checked-open diagnostic

on:
  push:
    branches: ["measure/t3code-ls-t16-checked-open-*"]

permissions:
  contents: read

jobs:
  reopen:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-checked-open-engine-reuse-paired-') && 45 || 35 }}
    env:
      NATIVE_COMMIT: 98726c9640a0c45f58310ce4180ac3e2d125f11c
      NATIVE_TREE: 8c92451b40f5f7266596d446ab8e306541f4390e
      PROBE_COMMIT: 126ee67adb8a0042d79c8bbc4ba600faa28026f8
      PROBE_TREE: c38176b1d15a863f4b4c3829b90fcc98b5b032c0
      OMDB_COMMIT: b2ff031398b1f0a793a352db7a699575b5d4d3d4
      OMDB_TREE: 8297dd226d54782c5940f6b95cef3c8f59e92281
      OMDB_PHASE_COMMIT: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-checked-open-engine-reuse-') && 'd29d60de9c8fb61331affc7f790c643ac2d32c05' || '410df55de0e17959bd75104c90431718382aded5' }}
      OMDB_PHASE_TREE: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-checked-open-engine-reuse-') && 'e5981a1ec8958420e6061db4390b5f41e87986bb' || '2028c97c9301f4164a5bb812bdc404f9c3245e8d' }}
      ENGINE_PHASE_PROOF: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-checked-open-engine-') }}
      ENGINE_REUSE_PROOF: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-checked-open-engine-reuse-') }}
      PAIRED_REUSE_PROOF: ${{ startsWith(github.ref_name, 'measure/t3code-ls-t16-checked-open-engine-reuse-paired-') }}
      STOCK_COMMIT: 28706aceb6fb3babf2cbae0dc0c3edd93b9b6d5f
      WASM_BINDGEN_VERSION: "0.2.130"
      WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=6144
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Verify source and stage the disposable checkouts
        shell: bash
        run: |
          git merge-base --is-ancestor "$NATIVE_COMMIT" HEAD
          test "$(git rev-parse "${NATIVE_COMMIT}^{tree}")" = "$NATIVE_TREE"
          test "$(uname -m)" = x86_64
          scratch="$(mktemp -d "$RUNNER_TEMP/t16-checked-open.XXXXXX")"
          printf '%s\n' "DIAGNOSTIC_WORK=$scratch" "CARGO_HOME=$scratch/cargo-home" \
            "CARGO_TARGET_DIR=$scratch/target" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/checked-open-evidence" "$scratch/trials" "$scratch/bin"
          evidence="$RUNNER_TEMP/checked-open-evidence"
          printf 'before\t%s\n' "$(df -Pk "$RUNNER_TEMP" | awk 'END {print $4}')" > "$evidence/available-kib.tsv"
          git worktree add --detach "$scratch/native" "$NATIVE_COMMIT"
          git init --quiet "$scratch/probe"
          git -C "$scratch/probe" fetch --no-tags --depth=1 https://github.com/glopyglerky/t3code-ls.git "$PROBE_COMMIT"
          git -C "$scratch/probe" checkout --detach FETCH_HEAD
          test "$(git -C "$scratch/probe" rev-parse HEAD)" = "$PROBE_COMMIT"
          test "$(git -C "$scratch/probe" rev-parse 'HEAD^{tree}')" = "$PROBE_TREE"
          cmp "$scratch/native/toolchain.lock.json" "$scratch/probe/toolchain.lock.json"
          grep -Fx "source = \"git+https://github.com/glopyglerky/omdb?rev=$OMDB_COMMIT#$OMDB_COMMIT\"" "$scratch/native/Cargo.lock"
          git -C "$scratch/probe" apply --unidiff-zero "$GITHUB_WORKSPACE/tools/diagnostics/t16-reopen-probe.patch"
          mkdir -p "$scratch/probe/tools/src/bin"
          cp tools/diagnostics/t16-checked-open.rs "$scratch/probe/tools/src/bin/t16-checked-open.rs"
          sha256sum tools/diagnostics/t16-* > "$evidence/diagnostic-source.sha256"
          if [[ "$ENGINE_PHASE_PROOF" == true ]]; then
            touch "$scratch/bin/engine-phases"
            python3 - "$scratch/native" "$OMDB_COMMIT" "$OMDB_PHASE_COMMIT" "$ENGINE_REUSE_PROOF" <<'PY'
          import json
          import pathlib
          import sys
          root, old, new = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          features = ["checked_open_diagnostics"]
          if sys.argv[4] == "true":
              features.append("checked_open_reuse_verified_pages")
          for relative in ("Cargo.lock", "database.lock.json", "crates/storage/Cargo.toml",
                           "apps/server/src/persistence/redb_transactions.rs"):
              path = root / relative
              text = path.read_text()
              if old not in text or new in text:
                  raise SystemExit(f"unexpected original source pin in {relative}")
              text = text.replace(old, new)
              if relative.endswith("Cargo.toml"):
                  tail = f'rev = "{new}" }}'
                  if text.count(tail) != 1:
                      raise SystemExit("expected one matching backend dependency")
                  text = text.replace(tail, f'rev = "{new}", features = {json.dumps(features)} }}')
              path.write_text(text)
          PY
            git -C "$scratch/native" diff --check
            git -C "$scratch/native" diff --binary > "$evidence/instrumentation.patch"
            sha256sum "$evidence/instrumentation.patch" > "$evidence/instrumentation.sha256"
          else
            test -x /usr/bin/strace || (sudo -n apt-get update && sudo -n apt-get install -y --no-install-recommends strace)
          fi
          npm install --global --prefix "$scratch/npm" --cache "$scratch/npm-cache" pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
          echo "$scratch/npm/bin" >> "$GITHUB_PATH"
          (cd "$scratch/native" && node tools/install-toolchain.mjs --destination "$scratch/toolchain")
      - name: Build the pinned packaged route and diagnostic
        shell: bash
        run: |
          cd "$DIAGNOSTIC_WORK/native"
          lustr="$T3_CODE_LS_TOOLCHAIN/bin/lustr"
          pnpm install --frozen-lockfile --store-dir "$DIAGNOSTIC_WORK/pnpm-store"
          "$lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" build \
            --release --locked --target wasm32-unknown-unknown -p t3-code-ls-client-text-web
          archive="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --max-time 120 --output "$DIAGNOSTIC_WORK/$archive.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$archive.tar.gz"
          printf '%s  %s\n' "$WASM_BINDGEN_SHA256" "$DIAGNOSTIC_WORK/$archive.tar.gz" | sha256sum --check
          tar -xzf "$DIAGNOSTIC_WORK/$archive.tar.gz" -O "$archive/wasm-bindgen" > "$DIAGNOSTIC_WORK/bin/wasm-bindgen"
          chmod u+x "$DIAGNOSTIC_WORK/bin/wasm-bindgen"
          "$DIAGNOSTIC_WORK/bin/wasm-bindgen" --target web --out-name composer_offsets \
            --out-dir apps/web/public/client-text-wasm \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/t3_code_ls_client_text_web.wasm"
          VITE_T3_CODE_LS_COMPOSER_OFFSETS=rust pnpm --dir apps/web run build
          T3_CODE_LS_IMPLEMENTATION=native node tools/build-native.mjs
          node tools/check-hybrid.mjs --verify-binaries
          T3_CODE_LS_IMPLEMENTATION=native T3_CODE_LS_NATIVE_DIR="$PWD/bin" \
            pnpm --dir apps/server run build:bundle
          evidence="$RUNNER_TEMP/checked-open-evidence"
          (cd apps/server/dist && sha256sum bin.mjs native-bin/t3-code-ls-db native-bin/manifest.json) \
            > "$evidence/packaged-artifacts.sha256"
          omdb=("$CARGO_HOME"/git/checkouts/omdb-*/*)
          test "${#omdb[@]}" -eq 1
          engine_commit="$OMDB_COMMIT"
          engine_tree="$OMDB_TREE"
          if [[ "$ENGINE_PHASE_PROOF" == true ]]; then
            engine_commit="$OMDB_PHASE_COMMIT"
            engine_tree="$OMDB_PHASE_TREE"
          fi
          test "$(git -C "${omdb[0]}" rev-parse HEAD)" = "$engine_commit"
          test "$(git -C "${omdb[0]}" rev-parse 'HEAD^{tree}')" = "$engine_tree"
          printf '%s %s\n' "$engine_commit" "$engine_tree" > "$evidence/engine-source.txt"
          ln -s "$PWD/apps/server/dist/native-bin/t3-code-ls-db" "$DIAGNOSTIC_WORK/bin/packaged-db"
          cd "$DIAGNOSTIC_WORK/probe"
          "$lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked -p t3code-ls-tools --bin t16-checked-open
          "$lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" build --release --locked -p t3code-ls-tools \
            --bin t3code-ls-tools --bin t16-checked-open
          install -m 755 "$CARGO_TARGET_DIR/release/t16-checked-open" "$DIAGNOSTIC_WORK/bin/t16-checked-open"
          (cd "$CARGO_TARGET_DIR/release" && sha256sum t3code-ls-tools t16-checked-open) > "$evidence/probes.sha256"
          jq '{release,compiler_revision,coordinator_revision,archive_sha256,checked_members}' \
            "$DIAGNOSTIC_WORK/toolchain/installation-proof.json" > "$evidence/toolchain.json"
      - name: Pair an untraced reopen with a helper-only trace
        if: env.ENGINE_PHASE_PROOF != 'true'
        shell: bash
        run: |
          umask 077
          scratch="$DIAGNOSTIC_WORK"
          evidence="$RUNNER_TEMP/checked-open-evidence"
          probe="$CARGO_TARGET_DIR/release/t3code-ls-tools"
          launcher="$scratch/bin/t16-checked-open"
          bundle="$scratch/native/apps/server/dist/bin.mjs"
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver || printf '%s/chromedriver' "$CHROMEWEBDRIVER")"
          test -x "$driver"
          jq -n --arg diagnostic "$GITHUB_SHA" --arg native "$NATIVE_COMMIT" --arg nativeTree "$NATIVE_TREE" \
            --arg probe "$PROBE_COMMIT" --arg probeTree "$PROBE_TREE" --arg omdb "$OMDB_COMMIT" \
            --arg omdbTree "$OMDB_TREE" --arg stock "$STOCK_COMMIT" --arg kernel "$(uname -r)" \
            --arg strace "$(/usr/bin/strace --version | sed -n '1p')" --arg node "$(node --version)" \
            --arg chrome "$("$chrome" --version)" --arg driver "$("$driver" --version)" \
            --arg runner "${ImageOS:-unknown}/${ImageVersion:-unknown}" --arg load "$(uptime)" --argjson cpus "$(nproc)" \
            '{journey:"J02",diagnostic:$diagnostic,native:$native,nativeTree:$nativeTree,probe:$probe,probeTree:$probeTree,
              omdb:$omdb,omdbTree:$omdbTree,stockDenominatorReference:$stock,durability:"omdb Immediate",
              kernel:$kernel,strace:$strace,node:$node,chrome:$chrome,driver:$driver,runner:$runner,load:$load,cpus:$cpus,
              cache:"same browser per seed and reopen, unmanaged filesystem cache"}' > "$evidence/inputs.json"
          printf 'round\tposition\tmode\tdescriptor_us\tpre_reopen_db_bytes\n' > "$evidence/reopen.tsv"
          printf 'round\tplain_descriptor_us\ttraced_descriptor_us\ttraced_minus_plain_us\n' > "$evidence/overhead.tsv"
          for round in 1 2 3 4; do
            modes=(plain trace)
            if (( round % 2 == 0 )); then modes=(trace plain); fi
            for position in 0 1; do
              mode="${modes[$position]}"
              trial="$scratch/trials/$round-$mode"
              sample="$evidence/reopen-$round-$mode.json"
              override=()
              if [[ "$mode" == trace ]]; then override=("T3_CODE_LS_DIAGNOSTIC_DB=$launcher"); fi
              sudo -n unshare --net --pid --fork --mount-proc --kill-child -- bash -euc '
                ip link set dev lo up
                user="$1"; shift
                exec runuser -u "$user" -- "$@"
              ' _ "$(id -un)" env -u T3_CODE_LS_DIAGNOSTIC_DB "${override[@]}" \
                "$probe" probe-reopen "$(command -v node)" "$bundle" "$trial" "$driver" "$chrome" native \
                | tee "$sample" > /dev/null
              jq -er --argjson round "$round" --argjson position "$((position + 1))" --arg mode "$mode" '
                select(.journey == "J02" and .profile == "native" and .native_lookups == false and .persistence_spans == null
                  and .snapshot.valid and .snapshot.threadCount == 32 and .snapshot.messageCount == 200
                  and .fixture.total_messages == 6400 and .database_migration > 0 and .database_bytes_at_reopen > 0
                  and .migration_evidence.source == "stopped-native-catalog"
                  and any(.resources.server.processes[]; .role == "native-database-helper"))
                | [$round,$position,$mode,.descriptor_micros,.database_bytes_at_reopen] | @tsv' "$sample" >> "$evidence/reopen.tsv"
              if [[ "$mode" == trace ]]; then
                "$launcher" summarize "$trial" > "$evidence/checked-open-$round.tsv"
              else
                test ! -e "$trial/checked-open-trace"
              fi
              rm -r -- "$trial"
            done
            match='{fixture,database_migration,saved_thread_sequence,snapshot:(.snapshot | {valid,threadCount,messageCount,selectedThreadId})}'
            plain="$evidence/reopen-$round-plain.json"
            trace="$evidence/reopen-$round-trace.json"
            diff -u <(jq -c "$match" "$plain") <(jq -c "$match" "$trace")
            jq -sr --argjson round "$round" '
              map(.descriptor_micros) as [$plain,$traced] | [$round,$plain,$traced,$traced - $plain] | @tsv' \
              "$plain" "$trace" >> "$evidence/overhead.tsv"
          done
      - name: Attribute checked-open reads inside the packaged database helper
        if: env.ENGINE_PHASE_PROOF == 'true' && env.PAIRED_REUSE_PROOF != 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$DIAGNOSTIC_WORK"
          evidence="$RUNNER_TEMP/checked-open-evidence"
          trial="$scratch/trials/engine-phases"
          probe="$CARGO_TARGET_DIR/release/t3code-ls-tools"
          bundle="$scratch/native/apps/server/dist/bin.mjs"
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver || printf '%s/chromedriver' "$CHROMEWEBDRIVER")"
          test -x "$driver"
          sudo -n unshare --net --pid --fork --mount-proc --kill-child -- bash -euc '
            ip link set dev lo up
            user="$1"; shift
            exec runuser -u "$user" -- "$@"
          ' _ "$(id -un)" env "T3_CODE_LS_DIAGNOSTIC_DB=$scratch/bin/t16-checked-open" \
            "$probe" probe-reopen "$(command -v node)" "$bundle" "$trial" "$driver" "$chrome" native \
            > "$evidence/engine-reopen.json"
          jq -e '.journey == "J02" and .profile == "native" and .snapshot.valid and
            .snapshot.threadCount == 32 and .snapshot.messageCount == 200 and .fixture.total_messages == 6400 and
            .database_migration > 0 and .saved_thread_sequence > 0' "$evidence/engine-reopen.json"
          awk -v reuse="$ENGINE_REUSE_PROOF" '
            BEGIN { print "phase\tbackend_reads\tbackend_read_errors\tbackend_bytes" }
            /^redb_checked_open / {
              if (NF != 5 || $2 !~ /^phase=(Preparation|VerifyCurrentRoots|VerifyAlternateRoots|RebuildDataAllocator|RebuildSystemAllocator|MarkPinnedPages|RepairCommit|RestoreSavepoints|RecordAllocator)$/ ||
                  $3 !~ /^backend_reads=[0-9]+$/ || $4 !~ /^backend_read_errors=0$/ || $5 !~ /^backend_bytes=[0-9]+$/) exit 1
              split($2, phase, "="); split($3, reads, "="); split($4, failures, "="); split($5, bytes, "=")
              if (seen[phase[2]]++) exit 1
              if (phase[2] == "VerifyCurrentRoots" || (reuse != "true" && phase[2] == "RebuildDataAllocator")) {
                if (reads[2] + 0 == 0 || bytes[2] + 0 == 0) exit 1
              }
              print phase[2] "\t" reads[2] "\t" failures[2] "\t" bytes[2]
            }
            END {
              if (!seen["VerifyCurrentRoots"] || !seen["RebuildDataAllocator"] || seen["VerifyAlternateRoots"] ||
                  !seen["RebuildSystemAllocator"] || !seen["RepairCommit"] || !seen["RecordAllocator"]) exit 1
            }
          ' "$trial/checked-open-phases.log" > "$evidence/engine-phases.tsv"
          if [[ "$ENGINE_REUSE_PROOF" == true ]]; then
            awk -F '\t' '
              $1 == "VerifyCurrentRoots" { verify_reads = $2; verify_bytes = $4 }
              $1 == "RebuildDataAllocator" { rebuilt_reads = $2; rebuilt_bytes = $4 }
              END {
                if (verify_reads == 0 || verify_bytes == 0 ||
                    rebuilt_reads * 4 >= verify_reads || rebuilt_bytes * 4 >= verify_bytes) exit 1
              }
            ' "$evidence/engine-phases.tsv"
          fi
      - name: Package the control with verified page reuse disabled
        if: env.PAIRED_REUSE_PROOF == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIAGNOSTIC_WORK/native"
          evidence="$RUNNER_TEMP/checked-open-evidence"
          mkdir -p apps/server/dist/client
          cp -a apps/web/dist/. apps/server/dist/client/
          cp -a apps/server/dist apps/server/dist-checked-open-control
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/storage/Cargo.toml")
          text = path.read_text()
          candidate = 'features = ["checked_open_diagnostics", "checked_open_reuse_verified_pages"]'
          assert text.count(candidate) == 1
          path.write_text(text.replace(candidate, 'features = ["checked_open_diagnostics"]'))
          PY
          git diff --check
          git diff --binary > "$evidence/control.patch"
          sha256sum "$evidence/control.patch" > "$evidence/control.sha256"
          built="$DIAGNOSTIC_WORK/control-build"
          T3_CODE_LS_IMPLEMENTATION=native node tools/build-native.mjs "$built"
          node --input-type=module - "$built" <<'JS'
          import { copyFileSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { nativeArtifactFiles, nativeHash } from "./tools/native-artifacts.mjs";
          const built = process.argv[2];
          const stage = "apps/server/dist-checked-open-control/native-bin";
          const file = "t3-code-ls-db";
          for (const directory of [built, stage]) nativeArtifactFiles(directory, "linux-x64");
          const manifestPath = join(stage, "manifest.json");
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          copyFileSync(join(built, file), join(stage, file));
          manifest.files[file] = nativeHash(join(stage, file));
          writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          nativeArtifactFiles(stage, "linux-x64");
          JS
          for variant in dist dist-checked-open-control; do
            (
              cd "apps/server/$variant"
              sha256sum bin.mjs native-bin/t3-code-ls-db native-bin/manifest.json client/index.html
            ) > "$evidence/$variant.sha256"
          done
          cmp apps/server/dist/bin.mjs apps/server/dist-checked-open-control/bin.mjs
          cmp apps/server/dist/client/index.html apps/server/dist-checked-open-control/client/index.html
          ! cmp -s apps/server/dist/native-bin/t3-code-ls-db apps/server/dist-checked-open-control/native-bin/t3-code-ls-db
          diff -u \
            <(jq -S 'del(.files["t3-code-ls-db"])' apps/server/dist/native-bin/manifest.json) \
            <(jq -S 'del(.files["t3-code-ls-db"])' apps/server/dist-checked-open-control/native-bin/manifest.json)
      - name: Compare paired packaged reopen readiness and resource use
        if: env.PAIRED_REUSE_PROOF == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$DIAGNOSTIC_WORK"
          evidence="$RUNNER_TEMP/checked-open-evidence"
          probe="$CARGO_TARGET_DIR/release/t3code-ls-tools"
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver || printf '%s/chromedriver' "$CHROMEWEBDRIVER")"
          test -x "$driver"
          {
            uname -srmo
            lscpu
            df -T "$RUNNER_TEMP"
            uptime
            "$chrome" --version
            "$driver" --version
          } > "$evidence/paired-host.txt"
          printf 'round\tposition\tvariant\tdescriptor_us\thtml_us\tsampled_server_cpu_ms\tsampled_server_rss_bytes\tdb_bytes\n' > "$evidence/paired-reopen.tsv"
          for round in 1 2 3 4 5; do
            variants=(control reuse)
            if (( round % 2 == 0 )); then variants=(reuse control); fi
            for position in 0 1; do
              variant="${variants[$position]}"
              directory=dist
              if [[ "$variant" == control ]]; then directory=dist-checked-open-control; fi
              trial="$scratch/trials/paired-$round-$variant"
              sample="$evidence/paired-$round-$variant.json"
              sudo -n unshare --net --pid --fork --mount-proc --kill-child -- bash -euc '
                ip link set dev lo up
                user="$1"; shift
                exec runuser -u "$user" -- "$@"
              ' _ "$(id -un)" env -u REDB_CHECKED_OPEN_DIAGNOSTICS -u T3_CODE_LS_DIAGNOSTIC_DB \
                "$probe" probe-reopen "$(command -v node)" "$scratch/native/apps/server/$directory/bin.mjs" \
                "$trial" "$driver" "$chrome" native | tee "$sample" > /dev/null
              jq -er --argjson round "$round" --argjson position "$((position + 1))" --arg variant "$variant" '
                select(.journey == "J02" and .profile == "native" and .native_lookups == false and .persistence_spans == null
                  and .snapshot.valid and .snapshot.threadCount == 32 and .snapshot.messageCount == 200
                  and .fixture.total_messages == 6400 and .database_migration > 0 and .database_bytes_at_reopen > 0
                  and .descriptor_micros > 0 and .html_micros > 0
                  and .migration_evidence.source == "stopped-native-catalog"
                  and any(.resources.server.processes[]; .role == "native-database-helper"))
                | [$round,$position,$variant,.descriptor_micros,.html_micros,.resources.server.observed_cpu_millis,
                   .resources.server.sampled_peak_sum_rss_bytes,.database_bytes_at_reopen] | @tsv' \
                "$sample" >> "$evidence/paired-reopen.tsv"
              test ! -e "$trial/checked-open-trace"
              test ! -e "$trial/checked-open-phases.log"
              rm -r -- "$trial"
            done
            match='{fixture,database_migration,saved_thread_sequence,snapshot:(.snapshot | {valid,threadCount,messageCount,selectedThreadId})}'
            diff -u <(jq -c "$match" "$evidence/paired-$round-control.json") \
              <(jq -c "$match" "$evidence/paired-$round-reuse.json")
          done
          test "$(wc -l < "$evidence/paired-reopen.tsv")" -eq 11
          uptime >> "$evidence/paired-host.txt"
      - name: Remove task-owned generated files and record available space
        if: always() && env.DIAGNOSTIC_WORK != ''
        shell: bash
        run: |
          case "$DIAGNOSTIC_WORK" in "$RUNNER_TEMP"/t16-checked-open.??????) ;; *) exit 1 ;; esac
          if [[ -f "$DIAGNOSTIC_WORK/native/.git" ]]; then
            git worktree remove --force "$DIAGNOSTIC_WORK/native"
          fi
          if [[ -d "$DIAGNOSTIC_WORK/toolchain" ]]; then
            find "$DIAGNOSTIC_WORK/toolchain" -type d ! -perm -u+w -exec chmod u+w '{}' +
          fi
          rm -r -- "$DIAGNOSTIC_WORK"
          printf 'after\t%s\n' "$(df -Pk "$RUNNER_TEMP" | awk 'END {print $4}')" >> "$RUNNER_TEMP/checked-open-evidence/available-kib.tsv"
      - name: Retain receipts and aggregate syscall observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checked-open-evidence
          path: ${{ runner.temp }}/checked-open-evidence/
