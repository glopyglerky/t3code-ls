          git -C "$scratch/strict-stock" diff --check
          test "$(git -C "$scratch/strict-stock" diff --name-only)" = apps/server/src/persistence/Sqlite.ts
          git -C "$scratch/strict-stock" diff --binary > "$evidence/strict-stock.patch"
          sha256sum "$evidence/strict-stock.patch" > "$evidence/strict-stock-patch.sha256"
          (
            cd "$scratch/strict-stock"
            pnpm install --frozen-lockfile --store-dir "$scratch/pnpm-store"
            mkdir -p apps/web/dist
            cp -a "$scratch/stock/apps/web/dist/." apps/web/dist/
            pnpm --dir apps/server run build:bundle
            sha256sum pnpm-lock.yaml
            find apps/server/dist apps/web/dist -type f -print0 | sort -z | xargs -0 -r sha256sum
          ) > "$evidence/strict-stock-build.txt"
          git -C "$scratch/stock" diff --exit-code
          (
            cd "$scratch/strict-stock"
            sha256sum pnpm-lock.yaml
            find apps/server/dist apps/web/dist -type f -print0 | sort -z | xargs -0 -r sha256sum
          ) > "$evidence/arm-strict-verifier.sha256"
          (cd "$scratch/stock" && sha256sum --check "$evidence/arm-stock.sha256") > "$evidence/stock-after-strict-build.txt"
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver || printf '%s/chromedriver' "$CHROMEWEBDRIVER")"
          test -x "$driver"
          # Two fresh same-path pairs in AB/BA order. Configuration/work verifier only.
          # These four samples are separate from the six-round, three-arm comparison.
          for round in 1 2; do
            variants=(stock strict)
            if [[ "$round" == 2 ]]; then variants=(strict stock); fi
            for variant in "${variants[@]}"; do
              root="$scratch/stock"
              if [[ "$variant" == strict ]]; then root="$scratch/strict-stock"; fi
              trial="$scratch/trials/strict-verifier"
              test ! -e "$trial"
              sample="$evidence/strict-verifier-$round-$variant.json"
              sudo -n unshare --mount --net --pid --fork --mount-proc --kill-child -- bash -euc '
                mount --make-rprivate /
                # Read-only source/bundles; only fresh synthetic profiles are writable.
                for root in "$1" "$2"; do
                  mount --bind "$root" "$root"
                  mount -o remount,bind,ro "$root"
                done
                shift 2
                ip link set dev lo up
                user="$1"; shift
                exec runuser -u "$user" -- "$@"
              ' _ "$scratch/stock" "$scratch/strict-stock" "$(id -un)" \
                env -u REDB_CHECKED_OPEN_DIAGNOSTICS -u T3_CODE_LS_DIAGNOSTIC_DB \
                "$probe" probe-reopen "$(command -v node)" "$root/apps/server/dist/bin.mjs" \
                "$trial" "$driver" "$chrome" stock > "$sample"
              jq -e '.profile == "stock" and .native_lookups == false and .persistence_spans == null
                and .readiness_phases == null and .snapshot.valid and .snapshot.threadCount == 32
                and .snapshot.messageCount == 200 and .database_migration > 0
                and .database_bytes_at_reopen > 0 and .readiness_evidence.runtime_pid_matched
                and .readiness_evidence.environment_id_matched and .readiness_evidence.html_root_matched
                and .migration_evidence.source == "live-sqlite-descriptors"' "$sample" > /dev/null
              "$verifier" account < "$sample" > "$evidence/strict-resources-$round-$variant.json"
              (
                cd "$trial"
                find .codex/sessions -type f -print0 | sort -z | xargs -0 sha256sum
              ) > "$evidence/strict-fixture-$round-$variant.sha256"
              rm -r -- "$trial"
            done
            cmp "$evidence/strict-fixture-$round-stock.sha256" "$evidence/strict-fixture-$round-strict.sha256"
            match='{fixture,fixture_workspace,database_migration,snapshot:(.snapshot | {valid,threadCount,messageCount,selectedThreadId})}'
            diff -u <(jq -c "$match" "$evidence/strict-verifier-$round-stock.json") \
              <(jq -c "$match" "$evidence/strict-verifier-$round-strict.json")
          done
          (cd "$scratch/stock" && sha256sum --check "$evidence/arm-stock.sha256") > "$evidence/stock-after-strict-workload.txt"
          jq -n --arg stock "$STOCK_COMMIT" --arg tree "$STOCK_TREE" \
            '{journey:"J02",kind:"strict-control-configuration-and-work-verifier",stock:$stock,tree:$tree,
              denominator:"unchanged SQLite WAL/NORMAL",extra_control:"SQLite WAL/FULL with writer readback assertions",
              pairs:2,order:[["stock","strict"],["strict","stock"]],balanced_performance_qualified:false,
              cpu_rss_qualified:false,power_loss_qualified:false,equal_durability_qualified:false,
              source_isolation:"read-only stock and strict roots in private mount namespace",
              profile_isolation:"fresh synthetic profile, loopback network and PID namespace, same fixture path",
              limits:["Strict setup adds two PRAGMA readbacks; configuration verifier, not plain timing arm",
                "No pooling with earlier runs or the separate three-arm observations",
                "FULL relies on SQLite VFS, filesystem and device sync semantics; no fault-injection proof",
                "Read-only mounts protect the workload view, not host-global immutable storage"]}' \
            > "$evidence/strict-verifier-scope.json"
      - name: Compare separate plain NORMAL FULL and Immediate arms
        if: env.PLAIN_STRICT_PROOF == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$DIAGNOSTIC_WORK"
          evidence="$RUNNER_TEMP/checked-open-evidence"
          verifier="$CARGO_TARGET_DIR/release/t16-strict-control"
          probe="$CARGO_TARGET_DIR/release/t3code-ls-tools"
          # The preceding untimed verifier retains the writer readback assertions.
          # This build differs from frozen stock by the synchronous assignment only.
          git clone --quiet --shared --no-checkout "$scratch/stock" "$scratch/full-stock"
          git -C "$scratch/full-stock" checkout --detach "$STOCK_COMMIT"
          "$verifier" plain-source "$scratch/full-stock" > "$scratch/full-source.ts"
          mv "$scratch/full-source.ts" "$scratch/full-stock/apps/server/src/persistence/Sqlite.ts"
          git -C "$scratch/full-stock" diff --check
          test "$(git -C "$scratch/full-stock" diff --name-only)" = apps/server/src/persistence/Sqlite.ts
          git -C "$scratch/full-stock" diff --binary > "$evidence/plain-full-stock.patch"
          sha256sum "$evidence/plain-full-stock.patch" > "$evidence/plain-full-stock.sha256"
          (
            cd "$scratch/full-stock"
            pnpm install --frozen-lockfile --store-dir "$scratch/pnpm-store"
            mkdir -p apps/web/dist
            cp -a "$scratch/stock/apps/web/dist/." apps/web/dist/
            pnpm --dir apps/server run build:bundle
          ) > "$evidence/plain-full-build.txt"
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver || printf '%s/chromedriver' "$CHROMEWEBDRIVER")"
          test -x "$driver"
          {
            uname -srmo
            lscpu
            df -T "$RUNNER_TEMP"
            uptime
            node --version
            pnpm --version
            "$chrome" --version
            "$driver" --version
            sha256sum "$(command -v node)" "$chrome" "$driver" "$probe" "$verifier"
            git show -s --format='%H %T'
            git -C "$scratch/native" show -s --format='%H %T'
            git -C "$scratch/probe" show -s --format='%H %T'
          } > "$evidence/plain-host-tools-source.txt"
          for variant in stock full native; do
            root="$scratch/$variant"
            if [[ "$variant" == full ]]; then root="$scratch/full-stock"; fi
            (
              cd "$root"
              sha256sum pnpm-lock.yaml
              find apps/server/dist apps/web/dist -type f -print0 | sort -z | xargs -0 -r sha256sum
            ) > "$evidence/plain-arm-$variant.sha256"
          done
          (cd "$scratch/stock" && sha256sum --check "$evidence/arm-stock.sha256") > "$evidence/plain-denominator-before.txt"
          rounds=6
          if [[ "$STORAGE_ACCOUNTING_PROOF" == true ]]; then rounds=1; fi
          jq -n --argjson rounds "$rounds" --arg stock "$STOCK_COMMIT" --arg stockTree "$STOCK_TREE" \
            --arg native "$NATIVE_COMMIT" --arg nativeTree "$NATIVE_TREE" \
            --arg engine "$OMDB_PHASE_COMMIT" --arg engineTree "$OMDB_PHASE_TREE" \
            --arg probe "$PROBE_COMMIT" --arg probeTree "$PROBE_TREE" \
            '{journey:"J02",kind:"separate-plain-strict-comparison",stock:$stock,stockTree:$stockTree,
              native:$native,nativeTree:$nativeTree,engine:$engine,engineTree:$engineTree,probe:$probe,probeTree:$probeTree,
              arms:["stock WAL/NORMAL","benchmark-only WAL/FULL","native Immediate, reuse enabled"],
              rounds:$rounds,balanced_orders:($rounds == 6),storage_accounting_only:($rounds == 1),performance_qualified:false,cpu_rss_qualified:false,
              equal_durability_qualified:false,power_loss_qualified:false,limiter_qualified:false,
              filesystem_cache:"unmanaged after import",pooling_allowed:false,
              policy_verification:"separate untimed readback verifier, not crash proof"}' > "$evidence/plain-inputs.json"
          printf 'round\tposition\tvariant\tdescriptor_us\thtml_us\n' > "$evidence/plain-reopen.tsv"
          for ((round=1; round<=rounds; round++)); do
            case "$round" in
              1) variants=(stock full native) ;;
              2) variants=(full native stock) ;;
              3) variants=(native stock full) ;;
              4) variants=(native full stock) ;;
              5) variants=(stock native full) ;;
              6) variants=(full stock native) ;;
            esac
            for position in 0 1 2; do
              variant="${variants[$position]}"
              root="$scratch/$variant"
              mode=stock
              if [[ "$variant" == full ]]; then root="$scratch/full-stock"; fi
              if [[ "$variant" == native ]]; then mode=native; fi
              trial="$scratch/trials/plain-strict"
              test ! -e "$trial"
              sample="$evidence/plain-$round-$variant.json"
              sudo -n unshare --mount --net --pid --fork --mount-proc --kill-child -- bash -euc '
                mount --make-rprivate /
                for root in "$1" "$2" "$3"; do
                  mount --bind "$root" "$root"
                  mount -o remount,bind,ro "$root"
                done
                shift 3
                ip link set dev lo up
                user="$1"; shift
                exec runuser -u "$user" -- "$@"
              ' _ "$scratch/stock" "$scratch/full-stock" "$scratch/native" "$(id -un)" \
                env -u REDB_CHECKED_OPEN_DIAGNOSTICS -u T3_CODE_LS_DIAGNOSTIC_DB T16_COMPLETED_WORK=1 \
                "$probe" probe-reopen "$(command -v node)" "$root/apps/server/dist/bin.mjs" \
                "$trial" "$driver" "$chrome" "$mode" > "$sample" 2> >(tee "$evidence/plain-$round-$variant.stderr.log" >&2)
              jq -er --argjson round "$round" --argjson position "$((position + 1))" --arg variant "$variant" '
                select(.journey == "J02" and .snapshot.valid
                  and .cached_paint_attribution_qualified == false
                  and .browser.firstShellVisibleMillis > 0 and .browser.selectedTextVisibleMillis > 0
                  and .browser.authoritativeShellHttpMillis > 0 and .browser.authoritativeThreadMillis > 0
                  and .migration_evidence.source == (if $variant == "native" then "stopped-native-catalog" else "live-sqlite-descriptors" end)
                  and (any(.resources.server.processes[]; .role == "native-database-helper") == ($variant == "native")))
                | [$round,$position,$variant,.descriptor_micros,.html_micros] | @tsv' "$sample" >> "$evidence/plain-reopen.tsv"
              # Separate untimed control. Probe has stopped browser and server.
              # Retain original strict matcher and all fixture/output gates below.
              "$verifier" footprint "$variant" "$trial" "$sample" \
                > "$evidence/plain-footprint-$round-$variant.json"
              if [[ "$STORAGE_ACCOUNTING_PROOF" == true && "$variant" == native ]]; then
                db="$trial/profile/userdata/statev2.omdb"
                sha256sum "$db" > "$evidence/plain-native-closed.sha256"
                "$CARGO_TARGET_DIR/release/t16-storage-accounting" "$trial" "$sample" \
                  > "$evidence/plain-native-storage-accounting.json"
                sha256sum --check --quiet "$evidence/plain-native-closed.sha256"
              fi
              if [[ "$round" == 1 ]]; then
                "$CARGO_TARGET_DIR/release/t16-cursor-diagnostic" "$mode" \
                  "$root/apps/server/dist/bin.mjs" "$trial" "$sample" \
                  > "$evidence/plain-cursor-diagnostic-$round-$variant.json"
              fi
              test ! -e "$trial/checked-open-trace"
              test ! -e "$trial/checked-open-phases.log"
              (
                cd "$trial"
                find .codex/sessions -type f -print0 | sort -z | xargs -0 sha256sum
              ) > "$evidence/plain-fixture-$round-$variant.sha256"
              rm -r -- "$trial"
            done
            # Keep all three raw marks before this fail-closed gate, including on mismatch.
            "$verifier" match "$evidence/plain-$round-stock.json" "$evidence/plain-$round-full.json" \
              "$evidence/plain-$round-native.json" > "$evidence/plain-equivalence-$round.json"
            cmp "$evidence/plain-fixture-$round-stock.sha256" "$evidence/plain-fixture-$round-full.sha256"
            cmp "$evidence/plain-fixture-$round-stock.sha256" "$evidence/plain-fixture-$round-native.sha256"
          done
          test "$(wc -l < "$evidence/plain-reopen.tsv")" -eq "$((1 + 3 * rounds))"
          for variant in stock full native; do
            root="$scratch/$variant"
            if [[ "$variant" == full ]]; then root="$scratch/full-stock"; fi
            (cd "$root" && sha256sum --check "$evidence/plain-arm-$variant.sha256") > "$evidence/plain-after-$variant.txt"
          done
          uptime >> "$evidence/plain-host-tools-source.txt"
      - name: Remove task-owned generated files and record available space
        if: always() && env.DIAGNOSTIC_WORK != ''
        shell: bash
        run: |
          case "$DIAGNOSTIC_WORK" in "$RUNNER_TEMP"/t16-checked-open.??????) ;; *) exit 1 ;; esac
          if [[ -f "$DIAGNOSTIC_WORK/native/.git" ]]; then
            git worktree remove --force "$DIAGNOSTIC_WORK/native"
          fi
          if [[ -d "$DIAGNOSTIC_WORK/toolchain" ]]; then
            find "$DIAGNOSTIC_WORK/toolchain" -type d ! -perm -u+w -exec chmod u+w '{}' +
          fi
          rm -r -- "$DIAGNOSTIC_WORK"
          printf 'after\t%s\n' "$(df -Pk "$RUNNER_TEMP" | awk 'END {print $4}')" >> "$RUNNER_TEMP/checked-open-evidence/available-kib.tsv"
      - name: Retain receipts and aggregate syscall observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checked-open-evidence
          path: ${{ runner.temp }}/checked-open-evidence/
          if-no-files-found: error
          retention-days: 14
