name: Linux Rust PTY host

on:
  push:
    branches: ["candidate/t3code-ls-t07-pty-host-*"]

permissions:
  contents: read

jobs:
  pty-host:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Install the verified compiler
        run: node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/pty-toolchain"
      - name: Exercise the real PTY and child lifecycle
        run: |
          export CARGO_HOME="$RUNNER_TEMP/pty-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pty-target"
          export CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0
          git show -s --format='%H %T'
          sha256sum apps/server/rust/pty-host/Cargo.lock
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" \
            test --locked --manifest-path apps/server/rust/pty-host/Cargo.toml
