name: Native CLI archive proof

on:
  push:
    branches:
      - "candidate/t3code-ls-t14-cli-contract-*"
      - "candidate/t3code-ls-t14-windows-cli-*"
      - "candidate/t3code-ls-t05-packaged-preparation-*"
      - "candidate/t3code-ls-t02-bundled-native-integrated-*"

permissions:
  contents: read

jobs:
  archive:
    if: ${{ !startsWith(github.ref_name, 'candidate/t3code-ls-t14-windows-cli-') }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=6144
      VP_REMOTE_CACHE: "off"
      T3_CODE_LS_IMPLEMENTATION: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Install the locked dependencies and compiler
        run: |
          npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
          node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/cli-toolchain"
      - name: Build and run the native archive
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cli-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cli-target"
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" \
            build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/cli-proof"
          pnpm --dir apps/web run build
          pnpm exec node apps/server/scripts/cli.ts build --verbose
          pnpm exec node apps/server/scripts/cli.ts build-exe --verbose
          mkdir -p apps/server/dist/resource-monitor
          install -m 0755 "$CARGO_TARGET_DIR/release/t3-resource-monitor" apps/server/dist/resource-monitor/
          version=$(node -p 'require("./apps/server/package.json").version')
          pnpm exec node scripts/build-cli-archive.ts --platform linux --arch x64 \
            --version "$version" --output-dir "$RUNNER_TEMP/cli-archive"
          archive="$RUNNER_TEMP/cli-archive/t3-$version-linux-x64.tar.gz"
          sha256sum "$archive" > "$RUNNER_TEMP/cli-proof/archive.sha256"
          node scripts/smoke-cli-archive.ts --archive "$archive" --expect-version "$version" \
            --expect-native | tee "$RUNNER_TEMP/cli-proof/smoke.log"
      - name: Verify the isolated candidate through the packaged executable
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t05-packaged-preparation-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-')
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/preparation-archive"
          mkdir "$extracted"
          version=$(node -p 'require("./apps/server/package.json").version')
          tar -xzf "$RUNNER_TEMP/cli-archive/t3-$version-linux-x64.tar.gz" -C "$extracted"
          entry="$extracted/t3-$version-linux-x64/t3"
          test -x "$entry"
          stat --printf='{"runtimeEntryBytes":%s}\n' "$entry" | tee "$RUNNER_TEMP/cli-proof/preparation-artifact.json"
          export CARGO_HOME="$RUNNER_TEMP/cli-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cli-target"
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked \
            -p t3-code-ls-storage --lib service_trial_executable_hash_has_an_independent_bound | tee "$RUNNER_TEMP/cli-proof/executable-limit.log"
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked \
            -p t3-code-ls-storage --lib isolated_trial | tee "$RUNNER_TEMP/cli-proof/native-trial.log"
          T3_TEST_PREPARE_ENTRY="$entry" \
          T3_TEST_SEALED_TRIAL_HELPER="$(dirname "$entry")/native-bin/t3-code-ls-db" \
            node --test --test-name-pattern 'compiled Rust helper restores' \
              tools/service-launcher-trial.test.mjs | tee "$RUNNER_TEMP/cli-proof/preparation.log"
      - name: Retain the archive identity and smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-archive-proof
          path: ${{ runner.temp }}/cli-proof/
          retention-days: 14

  windows-amd64:
    if: startsWith(github.ref_name, 'candidate/t3code-ls-t14-windows-cli-')
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['windows-2025'] || 'windows-2025' }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.99.1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=6144
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
      T3_CODE_LS_IMPLEMENTATION: upstream
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Install pinned host tools and frozen dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node -e 'if(process.platform!=="win32"||process.arch!=="x64"||process.versions.node!=="26.12.1") process.exit(1)'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/cli-windows-proof" | Out-Null
          rustup toolchain install 1.99.1 --profile minimal
          rustc +1.99.1 -Vv | Tee-Object "$env:RUNNER_TEMP/cli-windows-proof/compiler.log"
          npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
      - name: Build the real retained SEA and Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CARGO_HOME = "$env:RUNNER_TEMP/cli-windows-cargo-home"
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP/cli-windows-target"
          cargo +1.99.1 build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          pnpm --dir apps/web run build
          pnpm exec node apps/server/scripts/cli.ts build --verbose
          pnpm exec node apps/server/scripts/cli.ts build-exe --verbose
          New-Item -ItemType Directory -Force apps/server/dist/resource-monitor | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/release/t3-resource-monitor.exe" apps/server/dist/resource-monitor/
          $version = node -p 'require("./apps/server/package.json").version'
          # Qualification is explicitly unsigned, including on a configured self-hosted runner.
          Remove-Item Env:AZURE_TRUSTED_SIGNING_ENDPOINT, Env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME, Env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME -ErrorAction SilentlyContinue
          pnpm exec node scripts/build-cli-archive.ts --platform win --arch x64 --version $version --output-dir "$env:RUNNER_TEMP/cli-windows-archive"
          $archive = "$env:RUNNER_TEMP/cli-windows-archive/t3-$version-win32-x64.zip"
          $executable = 'apps/server/dist-exe/t3.exe'
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $executable))
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Expected a real PE executable' }
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550) { throw 'Expected PE header' }
          if ([BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) { throw 'Expected amd64 PE machine' }
          $stream = [System.IO.File]::OpenRead($archive)
          try {
            $signature = [byte[]]::new(4)
            if ($stream.Read($signature, 0, 4) -ne 4 -or [BitConverter]::ToUInt32($signature, 0) -ne 0x04034b50) { throw 'Expected a real ZIP archive' }
          } finally { $stream.Dispose() }
          $selection = Get-Content apps/server/dist-exe/native-bin/manifest.json -Raw | ConvertFrom-Json
          if ($selection.implementation -ne 'upstream' -or $selection.selection -ne 'explicit-upstream' -or $selection.target -ne 'win32-x64') { throw 'Incorrect Windows implementation selection' }
          [ordered]@{
            sourceCommit = (git rev-parse HEAD)
            platform = 'win32-x64'
            implementation = 'upstream'
            compilerRoute = 'bootstrap-cargo-resource-monitor'
            nodeVersion = (node --version)
            archiveSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            executableSha256 = (Get-FileHash $executable -Algorithm SHA256).Hash.ToLowerInvariant()
            monitorSha256 = (Get-FileHash apps/server/dist/resource-monitor/t3-resource-monitor.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            rustSourceSha256 = (Get-FileHash rust-toolchain.toml -Algorithm SHA256).Hash.ToLowerInvariant()
            monitorLockSha256 = (Get-FileHash native/resource-monitor/Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
            toolchainSourceSha256 = (Get-FileHash toolchain.lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
            nativeSelection = $selection
            signedRelease = $false
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/cli-windows-proof/artifact.json"
          node scripts/smoke-cli-archive.ts --archive $archive --expect-version $version --expect-upstream | Tee-Object "$env:RUNNER_TEMP/cli-windows-proof/smoke.log"
      - name: Retain exact Windows archive evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-windows-amd64-proof
          path: ${{ runner.temp }}/cli-windows-proof/
          retention-days: 14
