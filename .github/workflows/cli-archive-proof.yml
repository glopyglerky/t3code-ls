          path: ${{ runner.temp }}/cli-windows-proof/
          retention-days: 14
      - name: Remove the transferred archive and pinned pnpm staging
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('cli-windows-archive', 'cli-windows-pnpm', 'cli-windows-resources', 'cli-windows-cargo-home', 'cli-windows-target')) {
            $owned = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $owned) { Remove-Item -Recurse -Force $owned }
          }
