name: Native CLI archive proof

on:
  push:
    branches:
      - "candidate/t3code-ls-t14-cli-contract-*"
      - "candidate/t3code-ls-t14-windows-cli-*"
      - "candidate/t3code-ls-t14-windows-shim-oracle-*"
      - "candidate/t3code-ls-t14-macos-cli-*"
      - "candidate/t3code-ls-t14-linux-arm64-cli-*"
      - "candidate/t3code-ls-t14-windows-arm64-cli-*"
      - "candidate/t3code-ls-t05-packaged-preparation-*"
      - "candidate/t3code-ls-t06-gix-packaged-*"
      - "candidate/t3code-ls-t08-claude-package-refusal-*"
      - "candidate/t3code-ls-t10-packaged-guest-*"
      - "candidate/t3code-ls-t02-bundled-native-integrated-*"
      - "candidate/t3code-ls-t05-launcher-promotion-*"

permissions:
  contents: read

jobs:
  archive:
    if: >-
      !startsWith(github.ref_name, 'candidate/t3code-ls-t14-windows-cli-') &&
      !startsWith(github.ref_name, 'candidate/t3code-ls-t14-windows-shim-oracle-') &&
      !startsWith(github.ref_name, 'candidate/t3code-ls-t14-macos-cli-') &&
      !startsWith(github.ref_name, 'candidate/t3code-ls-t14-linux-arm64-cli-') &&
      !startsWith(github.ref_name, 'candidate/t3code-ls-t14-windows-arm64-cli-')
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=6144
      VP_REMOTE_CACHE: "off"
      T3_CODE_LS_IMPLEMENTATION: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Install the locked dependencies and compiler
        run: |
          npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
          node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/cli-toolchain"
      - name: Build and run the native archive
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cli-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cli-target"
          if [[ "$GITHUB_REF_NAME" == candidate/t3code-ls-t06-gix-packaged-* ||
                "$GITHUB_REF_NAME" == candidate/t3code-ls-t02-bundled-native-integrated-* ]]; then
            export T3_CODE_LS_BUNDLE_GIT_WORKSPACE=1
          fi
          if [[ "$GITHUB_REF_NAME" == candidate/t3code-ls-t08-claude-package-refusal-* ]]; then
            export T3_CODE_LS_BUNDLE_CLAUDE_STDIO=1
          fi
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" \
            build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/cli-proof"
          pnpm --dir apps/web run build
          pnpm exec node apps/server/scripts/cli.ts build --verbose
          pnpm exec node apps/server/scripts/cli.ts build-exe --verbose
          mkdir -p apps/server/dist/resource-monitor
          install -m 0755 "$CARGO_TARGET_DIR/release/t3-resource-monitor" apps/server/dist/resource-monitor/
          version=$(node -p 'require("./apps/server/package.json").version')
          pnpm exec node scripts/build-cli-archive.ts --platform linux --arch x64 \
            --version "$version" --output-dir "$RUNNER_TEMP/cli-archive"
          archive="$RUNNER_TEMP/cli-archive/t3-$version-linux-x64.tar.gz"
          sha256sum "$archive" > "$RUNNER_TEMP/cli-proof/archive.sha256"
          node scripts/smoke-cli-archive.ts --archive "$archive" --expect-version "$version" \
            --expect-native | tee "$RUNNER_TEMP/cli-proof/smoke.log"
      - name: Verify the isolated candidate through the packaged executable
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t05-packaged-preparation-') || startsWith(github.ref_name, 'candidate/t3code-ls-t05-launcher-promotion-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-')
        env:
          LAUNCHER_PROMOTION_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t05-launcher-promotion-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-') }}
          LAUNCHER_CANCEL_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t05-launcher-promotion-cancel-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-') }}
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/preparation-archive"
          mkdir "$extracted"
          version=$(node -p 'require("./apps/server/package.json").version')
          tar -xzf "$RUNNER_TEMP/cli-archive/t3-$version-linux-x64.tar.gz" -C "$extracted"
          entry="$extracted/t3-$version-linux-x64/t3"
          test -x "$entry"
          stat --printf='{"runtimeEntryBytes":%s}\n' "$entry" | tee "$RUNNER_TEMP/cli-proof/preparation-artifact.json"
          export CARGO_HOME="$RUNNER_TEMP/cli-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cli-target"
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked \
            -p t3-code-ls-storage --lib service_trial_executable_hash_has_an_independent_bound | tee "$RUNNER_TEMP/cli-proof/executable-limit.log"
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked \
            -p t3-code-ls-storage --lib isolated_trial | tee "$RUNNER_TEMP/cli-proof/native-trial.log"
          export T3_TEST_PREPARE_ENTRY="$entry"
          export T3_TEST_PREPARE_VERSION="$version"
          export T3_TEST_SEALED_TRIAL_HELPER="$(dirname "$entry")/native-bin/t3-code-ls-db"
          node --test --test-reporter tap --test-name-pattern 'compiled Rust helper (restores|rejects)' \
            tools/service-launcher-trial.test.mjs | tee "$RUNNER_TEMP/cli-proof/preparation.log"
          grep -E '^ok [1-9][0-9]* - compiled Rust helper restores ' "$RUNNER_TEMP/cli-proof/preparation.log"
          grep -E '^ok [1-9][0-9]* - compiled Rust helper rejects a mislabeled installed package before recording preparation$' "$RUNNER_TEMP/cli-proof/preparation.log"
          if [[ "$LAUNCHER_PROMOTION_PROOF" == true || "$LAUNCHER_CANCEL_PROOF" == true ]]; then
            candidate_version=$(node -p '(BigInt(process.argv[1].split(".", 1)[0]) + 1n) + ".0.0"' "$version")
            manifest=apps/server/package.json
            saved_manifest="$RUNNER_TEMP/previous-server-package.json"
            cp -p "$manifest" "$saved_manifest"
            restore_manifest() { cp -p "$saved_manifest" "$manifest"; }
            trap restore_manifest EXIT
            node -e '
              const fs = require("node:fs");
              const [file, version] = process.argv.slice(1);
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              fs.writeFileSync(file, JSON.stringify({ ...manifest, version }, null, 2) + "\n");
            ' "$manifest" "$candidate_version"
            if [[ "$GITHUB_REF_NAME" == candidate/t3code-ls-t02-bundled-native-integrated-* ]]; then
              export T3_CODE_LS_BUNDLE_GIT_WORKSPACE=1
            fi
            pnpm exec node apps/server/scripts/cli.ts build-exe --verbose
            pnpm exec node scripts/build-cli-archive.ts --platform linux --arch x64 \
              --version "$candidate_version" --output-dir "$RUNNER_TEMP/cli-archive"
            restore_manifest
            trap - EXIT
            git diff --exit-code HEAD -- "$manifest"
            candidate_archive="t3-$candidate_version-linux-x64.tar.gz"
            (cd "$RUNNER_TEMP/cli-archive" && sha256sum "$candidate_archive") > "$RUNNER_TEMP/cli-proof/candidate-archive.sha256"
            tar -xzf "$RUNNER_TEMP/cli-archive/$candidate_archive" -C "$extracted"
            candidate_entry="$extracted/t3-$candidate_version-linux-x64/t3"
            candidate_helper="$(dirname "$candidate_entry")/native-bin/t3-code-ls-db"
            test -x "$candidate_entry" && test -x "$candidate_helper"
          fi
          if [[ "$LAUNCHER_PROMOTION_PROOF" == true ]]; then
            sudo -n unshare --net -- bash -euc '
              ip link set dev lo up
              exec runuser -u "$1" -- env T3_TEST_LAUNCHER_PROMOTION_INTENT=1 \
                T3_TEST_LAUNCHER_SEALED_PUBLICATION=1 T3_TEST_LAUNCHER_SEALED_SERVING=1 \
                T3_TEST_PREPARE_ENTRY="$3" T3_TEST_SEALED_TRIAL_HELPER="$4" T3_TEST_PREVIOUS_RUNTIME_VERSION="$5" \
                T3_TEST_PREPARE_VERSION="$6" T3_TEST_PREVIOUS_RUNTIME_ENTRY="$7" \
                "$2" --test --test-reporter tap \
                --test-name-pattern "compiled Rust helper records" tools/service-launcher-trial.test.mjs
            ' _ "$(id -un)" "$(command -v node)" "$candidate_entry" "$candidate_helper" "$version" "$candidate_version" "$entry" \
              | tee "$RUNNER_TEMP/cli-proof/promotion-intent.log"
            grep -E '^ok [1-9][0-9]* - compiled Rust helper records ' "$RUNNER_TEMP/cli-proof/promotion-intent.log"
            grep -F 'Packaged serve refused the sealed catalog without publishing runtime state or modifying the database.' \
              "$RUNNER_TEMP/cli-proof/promotion-intent.log"
            grep -F 'The packaged launcher rolled back the published sealed trial and reopened the previous runtime.' \
              "$RUNNER_TEMP/cli-proof/promotion-intent.log"
          fi
          if [[ "$LAUNCHER_CANCEL_PROOF" == true ]]; then
            sudo -n unshare --net -- bash -euc '
              ip link set dev lo up
              exec runuser -u "$1" -- env T3_TEST_LAUNCHER_PROMOTION_INTENT=1 \
                T3_TEST_LAUNCHER_CANCEL_BEFORE_PUBLICATION=1 T3_TEST_PREPARE_ENTRY="$3" \
                T3_TEST_SEALED_TRIAL_HELPER="$4" T3_TEST_PREVIOUS_RUNTIME_VERSION="$5" \
                T3_TEST_PREPARE_VERSION="$6" T3_TEST_PREVIOUS_RUNTIME_ENTRY="$7" \
                "$2" --test --test-reporter tap \
                --test-name-pattern "compiled Rust helper records" tools/service-launcher-trial.test.mjs
            ' _ "$(id -un)" "$(command -v node)" "$candidate_entry" "$candidate_helper" "$version" "$candidate_version" "$entry" \
              | tee "$RUNNER_TEMP/cli-proof/promotion-cancel.log"
            grep -F 'Cancelled the unstarted promotion and reopened the exact previous packaged server.' \
              "$RUNNER_TEMP/cli-proof/promotion-cancel.log"
          fi
      - name: Verify optional package manifests and normal Git reads from the archive
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t06-gix-packaged-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-')
        shell: bash
        run: |
          set -euo pipefail
          env -u T3_CODE_LS_IMPLEMENTATION node --test tools/native-packaging.test.mjs
          extracted="$RUNNER_TEMP/gix-archive"
          mkdir "$extracted"
          trap 'rm -rf -- "$extracted"' EXIT
          version=$(node -p 'require("./apps/server/package.json").version')
          tar -xzf "$RUNNER_TEMP/cli-archive/t3-$version-linux-x64.tar.gz" -C "$extracted"
          entry="$extracted/t3-$version-linux-x64/t3"
          test -x "$entry"
          sudo -n unshare --net -- bash -euc '
            ip link set dev lo up
            exec runuser -u "$1" -- "$2" apps/server/scripts/verify-packaged-git-workspace.ts "$3" "$4"
          ' _ "$(id -un)" "$(command -v node)" "$RUNNER_TEMP/cli-proof/git-workspace" "$entry"
      - name: Verify packaged Claude MCP option refusal and native reopen
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t08-claude-package-refusal-')
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cli-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cli-target"
          scratch=$(mktemp -d "$RUNNER_TEMP/claude-archive.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN"             test --locked -p t3-code-ls-core --no-run --test claude_stdio_host             --message-format=json > "$scratch/fixture.ndjson"
          fixture=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and
            .target.name == "claude_stdio_host" and .executable != null) | .executable] |
            if length == 1 then .[0] else error("Missing unique Claude fixture executable") end'             "$scratch/fixture.ndjson")
          test -x "$fixture"
          version=$(node -p 'require("./apps/server/package.json").version')
          tar -xzf "$RUNNER_TEMP/cli-archive/t3-$version-linux-x64.tar.gz" -C "$scratch"
          entry="$scratch/t3-$version-linux-x64/t3"
          test -x "$entry"
          test -x /usr/bin/strace
          proof="$RUNNER_TEMP/cli-proof/claude-options-refusal"
          sudo -n unshare --net -- bash -euc '
            ip link set dev lo up
            exec runuser -u "$1" -- "$2" apps/server/scripts/verify-packaged-claude-stdio.ts "$3" "$4" "$5"
          ' _ "$(id -un)" "$(command -v node)" "$proof" "$entry" "$fixture"
          jq -e '.status == "passed" and .conversationQualified == false and .observed.reopened and
            .observed.controlledOpenRefusedMcpOptions and (.observed.helperOrProviderExecuted | not)' "$proof/proof.json"
      - name: Install Chromium for the HTTPS browser guest fixture
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t10-packaged-guest-browser-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-')
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Verify guest authorization and redemption across a native reopen
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t10-packaged-guest-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-')
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/server/package.json").version')
          extracted=$(mktemp -d "$RUNNER_TEMP/guest-archive.XXXXXX")
          trap 'rm -rf -- "$extracted"' EXIT
          tar -xzf "$RUNNER_TEMP/cli-archive/t3-$version-linux-x64.tar.gz" -C "$extracted"
          entry="$extracted/t3-$version-linux-x64/t3"
          test -x "$entry"
          args=()
          case "$GITHUB_REF_NAME" in
            candidate/t3code-ls-t10-packaged-guest-browser-*|candidate/t3code-ls-t02-bundled-native-integrated-*) args=(--browser) ;;
          esac
          sudo -n unshare --net -- bash -euc '
            ip link set dev lo up
            runner=$1
            command=$2
            shift 2
            exec runuser -u "$runner" -- "$command" apps/server/scripts/verify-packaged-guest-authorization.ts "$@"
          ' _ "$(id -un)" "$(command -v node)" "$RUNNER_TEMP/cli-proof/guest-authorization" "$entry" "${args[@]}"
          if (( ${#args[@]} > 0 )); then
            jq -e '.status == "passed" and .browser.secureScopedCookie and .browser.keyboardJoined and
              .browser.recoveredWithoutCredential and .browser.revokedAfterProcessReopen' \
              "$RUNNER_TEMP/cli-proof/guest-authorization/proof.json"
          fi
      - name: Retain the archive identity and smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-archive-proof
          path: ${{ runner.temp }}/cli-proof/
          retention-days: 14

  linux-arm64-archive:
    if: startsWith(github.ref_name, 'candidate/t3code-ls-t14-linux-arm64-cli-')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=4096
      T3_CODE_LS_IMPLEMENTATION: upstream
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Build and run the ARM64 CLI archive on its target architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(node -p '`${process.platform}-${process.arch}`')" = linux-arm64
          proof="$RUNNER_TEMP/cli-linux-arm64-proof"
          scratch="$(mktemp -d "$RUNNER_TEMP/cli-linux-arm64.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir "$proof" "$scratch/resources"
          git rev-parse HEAD HEAD^{tree} > "$proof/source.txt"
          export CARGO_HOME="$scratch/cargo" CARGO_TARGET_DIR="$scratch/target"
          rustup toolchain install 1.99.1 --profile minimal
          rustc +1.99.1 --version --verbose > "$proof/compiler.txt"
          cargo +1.99.1 build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          install -m 0755 "$CARGO_TARGET_DIR/release/t3-resource-monitor" "$scratch/resources/"
          npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
          pnpm --dir apps/web run build
          pnpm exec node apps/server/scripts/cli.ts build --verbose
          pnpm exec node apps/server/scripts/cli.ts build-exe --verbose
          version="$(node -p 'require("./apps/server/package.json").version')"
          pnpm exec node scripts/build-cli-archive.ts --platform linux --arch arm64 \
            --version "$version" --resource-monitor-dir "$scratch/resources" --output-dir "$scratch"
          stem="t3-$version-linux-arm64"
          archive="$scratch/$stem.tar.gz"
          (cd "$scratch" && sha256sum "$stem.tar.gz") > "$proof/archive.sha256"
          file apps/server/dist-exe/t3 "$scratch/resources/t3-resource-monitor" > "$proof/file.txt"
          sudo -n unshare --net -- bash -euc '
            ip link set dev lo up
            exec runuser -u "$1" -- "$2" scripts/smoke-cli-archive.ts --archive "$3" \
              --expect-version "$4" --expect-upstream
          ' _ "$(id -un)" "$(command -v node)" "$archive" "$version" | tee "$proof/smoke.log"
      - name: Retain exact archive hashes and smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-linux-arm64-proof
          path: ${{ runner.temp }}/cli-linux-arm64-proof/
          if-no-files-found: error
          retention-days: 14

  macos-archive:
    if: startsWith(github.ref_name, 'candidate/t3code-ls-t14-macos-cli-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCHIVE_ARCH: ${{ matrix.arch }}
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=4096
      T3_CODE_LS_IMPLEMENTATION: upstream
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Build, sign and run the same-architecture CLI archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p '`${process.platform}-${process.arch}`')" = "darwin-$ARCHIVE_ARCH"
          case "$(uname -m):$ARCHIVE_ARCH" in arm64:arm64|x86_64:x64) ;; *) exit 1 ;; esac
          proof="$RUNNER_TEMP/cli-macos-proof"
          scratch="$(mktemp -d "$RUNNER_TEMP/cli-macos.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir "$proof" "$scratch/extracted" "$scratch/resources"
          git rev-parse HEAD HEAD^{tree} > "$proof/source.txt"
          export CARGO_HOME="$scratch/cargo" CARGO_TARGET_DIR="$scratch/target" RUSTUP_HOME="$scratch/rustup"
          rustup toolchain install 1.99.1 --profile minimal
          rustc +1.99.1 --version --verbose > "$proof/compiler.txt"
          cargo +1.99.1 build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          install -m 0755 "$CARGO_TARGET_DIR/release/t3-resource-monitor" "$scratch/resources/"
          npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
          pnpm --dir apps/web run build
          pnpm exec node apps/server/scripts/cli.ts build --verbose
          pnpm exec node apps/server/scripts/cli.ts build-exe --verbose
          version="$(node -p 'require("./apps/server/package.json").version')"
          unset T3CODE_CLI_MAC_SIGN_IDENTITY APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          pnpm exec node scripts/build-cli-archive.ts --platform mac --arch "$ARCHIVE_ARCH" \
            --version "$version" --resource-monitor-dir "$scratch/resources" --output-dir "$scratch"
          stem="t3-$version-darwin-$ARCHIVE_ARCH"
          archive="$scratch/$stem.tar.gz"
          (cd "$scratch" && shasum -a 256 "$stem.tar.gz") > "$proof/archive.sha256"
          tar -xzf "$archive" -C "$scratch/extracted"
          (
            cd "$scratch/extracted/$stem"
            shasum -a 256 t3 resource-monitor/t3-resource-monitor > "$proof/components.sha256"
            codesign --verify --strict t3
            codesign --verify --strict resource-monitor/t3-resource-monitor
            file t3 resource-monitor/t3-resource-monitor > "$proof/file.txt"
          )
          node scripts/smoke-cli-archive.ts --archive "$archive" --expect-version "$version" \
            --expect-upstream | tee "$proof/smoke.log"
      - name: Retain exact archive hashes and smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-macos-${{ matrix.arch }}-proof
          path: ${{ runner.temp }}/cli-macos-proof/
          if-no-files-found: error
          retention-days: 14

  windows-shim-oracle:
    if: >-
      startsWith(github.ref_name, 'candidate/t3code-ls-t14-windows-cli-') ||
      startsWith(github.ref_name, 'candidate/t3code-ls-t14-windows-shim-oracle-') ||
      startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-')
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['windows-2025'] || 'windows-2025' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Check cmd argument and exit preservation
        shell: pwsh
        env:
