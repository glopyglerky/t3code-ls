name: Rust composer browser proof

on:
  push:
    branches:
      - "candidate/t3code-ls-t01-offsets-*"
      - "candidate/t3code-ls-t01-built-composer-*"
      - "candidate/t3code-ls-t01-dioxus-pairing-*"
      - "candidate/t3code-ls-t11-dioxus-guest-*"
      - "candidate/t3code-ls-t02-bundled-native-*"
      - "candidate/t3code-ls-t06-file-revisions-*"

permissions:
  contents: read

jobs:
  composer-offsets:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      GIT_TERMINAL_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=6144
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: ""
      WASM_BINDGEN_VERSION: "0.2.130"
      WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
      BUNDLED_NATIVE: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-') || startsWith(github.ref_name, 'candidate/t3code-ls-t06-file-revisions-') }}
      DIOXUS_COMPOSITION_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-dioxus-composed-') }}
      INTEGRATED_NATIVE: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-') }}
      FORK_HISTORY_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t04-coherent-history-') }}
      NATIVE_PTY_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-integrated-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t07-pty-host-') }}
      PAIRING_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t01-dioxus-pairing-') }}
      GUEST_NAME_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t11-dioxus-guest-') }}
      DIOXUS_NAVIGATION_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-dioxus-navigation-') }}
      DIOXUS_TIMELINE_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-dioxus-timeline-') }}
      DIOXUS_STOP_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-dioxus-stop-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-dioxus-timeline-') }}
      DIOXUS_SUBMIT_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-dioxus-send-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-dioxus-stop-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-dioxus-timeline-') }}
      DIOXUS_APPROVAL_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-dioxus-approval-') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Install the pinned compiler package
        run: node tools/install-toolchain.mjs --destination "$RUNNER_TEMP/composer-toolchain"
      - name: Build the browser binding with the packaged Wasm sysroot
        run: |
          export CARGO_HOME="$RUNNER_TEMP/composer-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/composer-target"
          archive="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$archive.tar.gz"
          printf '%s  %s\n' "$WASM_BINDGEN_SHA256" "$RUNNER_TEMP/$archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -O "$archive/wasm-bindgen" > "$RUNNER_TEMP/wasm-bindgen"
          chmod u+x "$RUNNER_TEMP/wasm-bindgen"
          build_binding() {
            local package="$1" wasm="$2" binding="$3" bindings_dir="$4"
            "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" build \
              --release --locked --target wasm32-unknown-unknown -p "$package"
            "$RUNNER_TEMP/wasm-bindgen" --target web --out-name "$binding" \
              --out-dir "$bindings_dir" \
              "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/$wasm.wasm"
            sha256sum "$bindings_dir/$binding.js" "$bindings_dir/${binding}_bg.wasm"
          }
          if [[ "$PAIRING_PROOF" != true ]]; then
            build_binding t3-code-ls-client-text-web t3_code_ls_client_text_web \
              composer_offsets apps/web/public/client-text-wasm
          fi
          if [[ "$DIOXUS_COMPOSITION_PROOF" == true || "$PAIRING_PROOF" == true || "$INTEGRATED_NATIVE" == true || "$GUEST_NAME_PROOF" == true || "$DIOXUS_SUBMIT_PROOF" == true || "$DIOXUS_APPROVAL_PROOF" == true || "$DIOXUS_NAVIGATION_PROOF" == true ]]; then
            build_binding t3-code-ls-web-pairing t3_code_ls_web_pairing \
              local_pairing "$RUNNER_TEMP/pairing-wasm"
          fi
      - name: Install the locked web testing dependencies
        run: |
          npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile
          node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Install Chromium with microphone support
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t13-voice-')
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --no-shell chromium
      - name: Compare Codex import canonicalization with the retained scanner behavior
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t08-import-compressed-rust-')
        env:
          T3_CODE_LS_IMPLEMENTATION: upstream
        run: |
          export CARGO_HOME="$RUNNER_TEMP/composer-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/composer-target"
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked \
            -p t3-code-ls-core --lib codex_import
          pnpm --dir apps/server exec vp test run --maxWorkers 2 src/project/AgentSessionScanner.test.ts
      - name: Verify root workspace release and pull request refresh
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t16-root-release-')
        env:
          T3_CODE_LS_IMPLEMENTATION: upstream
        run: |
          pnpm --dir apps/server exec vp test run --maxWorkers 2 \
            src/orchestration-v2/ThreadLaunchService.test.ts src/orchestration-v2/ThreadPullRequestService.test.ts
      - name: Type check the full server with the pinned Rust checker
        id: server-types
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t16-root-release-server-types-')
        run: node node_modules/@effect/tsgo/dist/effect-tsgo.cjs tsrs --noEmit --pretty false -p apps/server/tsconfig.json
      - name: Compare a typecheck failure with the pinned Go checker and Effect diagnostics
        if: failure() && steps.server-types.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          checker=node_modules/@effect/tsgo/dist/effect-tsgo.cjs
          status=0
          node "$checker" tsc --noEmit --pretty false -p apps/server/tsconfig.json || status=$?
          echo "Go checker exit status $status"
          node "$checker" diagnostics --project apps/server/tsconfig.json --format text --severity error,warning
      - name: Exercise the selected runtime service graph
        if: ${{ !cancelled() && steps.server-types.outcome != 'skipped' && startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t16-root-release-server-types-') }}
        env:
          T3_CODE_LS_IMPLEMENTATION: upstream
        run: |
          pnpm --dir apps/server exec vp test run --maxWorkers 2 \
            src/cli/app.test.ts src/cli/connect.test.ts src/cli/deferredImports.test.ts src/cli/pair.test.ts \
            src/ws.test.ts src/relay/AgentAwarenessRelay.test.ts src/workspace/WorkspaceFileSystem.test.ts
      - name: Exercise local pairing in the retained and Dioxus browser builds
        if: env.PAIRING_PROOF == 'true'
        env:
          T3_CODE_LS_BUNDLED_CLIENT_PROOF: "1"
        run: |
          proof="$RUNNER_TEMP/built-composer-proof"
          mkdir "$proof"
          node node_modules/@effect/tsgo/dist/effect-tsgo.cjs tsrs --noEmit -p tools/hybrid-client-persistence-tsconfig.json
          for renderer in retained dioxus; do
            if [[ "$renderer" == dioxus ]]; then
              cp -R "$RUNNER_TEMP/pairing-wasm" apps/web/public/pairing-wasm
              export VITE_T3_CODE_LS_PAIRING_RENDERER=dioxus
            fi
            pnpm --dir apps/web run build
            env -u T3_CODE_LS_TOOLCHAIN -u T3_CODE_LS_SYSROOT T3_CODE_LS_IMPLEMENTATION=upstream \
              pnpm --dir apps/server run build:bundle
            sha256sum apps/web/dist/index.html apps/server/dist/bin.mjs > "$proof/$renderer.sha256"
            if [[ "$renderer" == dioxus ]]; then
              find apps/web/dist/pairing-wasm -type f -print0 | sort -z | xargs -0 sha256sum >> "$proof/$renderer.sha256"
            fi
            # apps/web/src/components/onboarding/WelcomePage.import.browser.test.tsx
            pnpm --dir apps/web exec vp test run --project browser --maxWorkers 2 \
              src/components/onboarding/WelcomePage.import.browser.test.tsx
            mkdir "$proof/$renderer"
            T3_CODE_LS_PAIRING_PROOF="$renderer" \
              node apps/web/scripts/verify-hybrid-client.ts "$proof/$renderer" upstream
          done
          mkdir "$proof/dioxus-fallback"
          T3_CODE_LS_PAIRING_PROOF=dioxus-fallback \
            node apps/web/scripts/verify-hybrid-client.ts "$proof/dioxus-fallback" upstream
      - name: Exercise guest name controls and packaged guest entry without live invites
        if: env.GUEST_NAME_PROOF == 'true'
        env:
          T3_CODE_LS_BUNDLED_CLIENT_PROOF: "1"
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/built-composer-proof"
          mkdir "$proof"
          test ! -e apps/web/public/pairing-wasm
          cp -R "$RUNNER_TEMP/pairing-wasm" apps/web/public/pairing-wasm
          trap 'rm -rf -- apps/web/public/pairing-wasm' EXIT
          for renderer in retained dioxus; do
            if [[ "$renderer" == dioxus ]]; then export VITE_T3_CODE_LS_GUEST_NAME_RENDERER=dioxus; fi
            # apps/web/src/components/guest/GuestNameForm.browser.test.tsx
            pnpm --dir apps/web exec vp test run --project browser --maxWorkers 2 \
              src/components/guest/GuestPage.browser.test.tsx src/components/guest/GuestNameForm.browser.test.tsx
            pnpm --dir apps/web run build
            env -u T3_CODE_LS_TOOLCHAIN -u T3_CODE_LS_SYSROOT T3_CODE_LS_IMPLEMENTATION=upstream \
              pnpm --dir apps/server run build:bundle
            mkdir "$proof/guest-$renderer"
            T3_CODE_LS_GUEST_NAME_PROOF="$renderer" node apps/web/scripts/verify-hybrid-client.ts "$proof/guest-$renderer" upstream
          done
          mkdir "$proof/guest-dioxus-fallback"
          T3_CODE_LS_GUEST_NAME_PROOF=dioxus-fallback node apps/web/scripts/verify-hybrid-client.ts "$proof/guest-dioxus-fallback" upstream
      - name: Exercise the composer with the retained offset mapper
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t01-offsets-')
        working-directory: apps/web
        run: pnpm exec vp test run --project browser --maxWorkers 2 src/components/ComposerPromptEditorTiptap.input.browser.test.tsx
      - name: Exercise the real composer with Rust offset mapping
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t01-offsets-')
        env:
          VITE_T3_CODE_LS_COMPOSER_OFFSETS: rust
        working-directory: apps/web
        run: pnpm exec vp test run --project browser --maxWorkers 2 src/components/ComposerPromptEditorTiptap.input.browser.test.tsx
      - name: Exercise portable draft reconciliation and binding validation
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-drafts-')
        run: |
          export CARGO_HOME="$RUNNER_TEMP/composer-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/composer-target"
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked -p t3-code-ls-client-text --test draft
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" test --locked -p t3-code-ls-client-text-web --lib draft_binding_tests
      - name: Exercise same-draft saves in both orders
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-drafts-')
        working-directory: apps/web
        run: pnpm exec vp test run --project unit --maxWorkers 2 src/composerDraftStore.test.ts
      - name: Compare draft reconciliation with the retained oracle through real Wasm
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-drafts-')
        env:
          VITE_T3_CODE_LS_DRAFT_RECONCILIATION: rust
        working-directory: apps/web
        run: pnpm exec vp test run --project browser --maxWorkers 2 "$GITHUB_WORKSPACE/apps/web/src/composerDraftReconciliation.browser.test.ts"
      - name: Exercise voice draft selection through the Rust browser binding
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t13-voice-')
        env:
          VITE_T3_CODE_LS_COMPOSER_OFFSETS: rust
        working-directory: apps/web
        run: pnpm exec vp test run --project browser --maxWorkers 2 src/speech/useEnvironmentSpeechInput.browser.test.tsx
      - name: Exercise selection compatibility and invalid boundaries
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t13-voice-')
        run: pnpm exec vp test run --maxWorkers 2 packages/client-runtime/src/voice-input/controller.test.ts
      - name: Exercise the text splice encoder and legacy fallback
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t03-splice-')
        working-directory: apps/server
        run: pnpm exec vp test run --maxWorkers 2 src/orchestration-v2/WireProjection.test.ts
      - name: Exercise fenced update and rollback selection
        if: env.INTEGRATED_NATIVE == 'true'
        run: node --test tools/service-launcher-trial.test.mjs
      - name: Recover mobile preferences across database faults and reopen
        if: env.INTEGRATED_NATIVE == 'true'
        working-directory: apps/mobile
        run: pnpm exec vp test run --project unit --maxWorkers 2 src/persistence/mobile-database.test.ts
      - name: Exercise terminal attachment and parser continuity
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t07-')
        working-directory: apps/server
        run: |
          # apps/server/src/terminal/Manager.test.ts
          pnpm exec vp test run --maxWorkers 2 src/terminal/Manager.test.ts
      - name: Exercise peer reconnect and task-cache recovery
        if: env.INTEGRATED_NATIVE == 'true'
        run: |
          pnpm --dir apps/server exec vp test run --maxWorkers 2 src/peer/PeerLinks.test.ts
          pnpm --filter @t3tools/task-cache test src/Cleanup.test.ts src/Cache.test.ts \
            src/NativeClients.test.ts src/Savings.test.ts
      - name: Exercise restart recovery and persisted continuation effects
        if: env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t09-relay-')
        env:
          T3_CODE_LS_IMPLEMENTATION: upstream
        run: |
          pnpm --dir apps/server exec vp test run --maxWorkers 2 \
            src/orchestration-v2/RestartContinuation.test.ts src/orchestration-v2/ProviderRuntimeRecoveryService.test.ts
      - name: Build the selected Rust PTY host
        if: env.NATIVE_PTY_PROOF == 'true'
        run: |
          export CARGO_HOME="$RUNNER_TEMP/pty-cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pty-target"
          # apps/server/rust/pty-host/tests/owner.rs
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" \
            test --locked --manifest-path apps/server/rust/pty-host/Cargo.toml --test owner
          "$T3_CODE_LS_TOOLCHAIN/bin/lustr" --bluefe-root "$T3_CODE_LS_TOOLCHAIN" \
            build --release --locked --manifest-path apps/server/rust/pty-host/Cargo.toml
          sha256sum "$CARGO_TARGET_DIR/release/t3-code-ls-pty-host"
          printf 'T3_CODE_LS_PTY_PROOF_EXECUTABLE=%s\n' \
            "$CARGO_TARGET_DIR/release/t3-code-ls-pty-host" >> "$GITHUB_ENV"
      - name: Exercise the native adapter's exit after terminal detach
        if: env.NATIVE_PTY_PROOF == 'true'
        run: |
          # apps/server/src/terminal/NativePtyAdapter.integration.test.ts
          pnpm --dir apps/server exec vp test run --maxWorkers 2 src/terminal/NativePtyAdapter.integration.test.ts
      - name: Type-check the selected terminal adapter through the server
        if: env.NATIVE_PTY_PROOF == 'true'
        run: |
          export T3_CODE_LS_TEST_RUNTIME="$RUNNER_TEMP/pty-typecheck-runtime"
          node tools/install-server-tests.mjs
          status=0
          "$T3_CODE_LS_TEST_RUNTIME/node_modules/.bin/effect-tsgo" tsrs --noEmit \
            -p tools/omdb-production-tsconfig.json > "$RUNNER_TEMP/pty-typecheck.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/pty-typecheck.log"
          exit "$status"
      - name: Check the dedicated external PDF component scope
        if: startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t13-pdf-external-')
        working-directory: apps/web
        run: pnpm exec vp test run --project browser --maxWorkers 2 src/components/files/PdfViewer.browser.test.tsx
      - name: Build and open the application with the Rust composer binding
        if: env.BUNDLED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t01-built-composer-')
        env:
          T3_CODE_LS_BUNDLED_CLIENT_PROOF: "1"
          T3_CODE_LS_BUNDLED_PTY_PROOF: ${{ env.NATIVE_PTY_PROOF }}
          T3_CODE_LS_PTY_RESTART_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t07-pty-host-restart-') }}
          T3_CODE_LS_SPLICE_NEGOTIATION_PROOF: ${{ env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t03-splice-') }}
          T3_CODE_LS_SPLIT_PTY_PROOF: ${{ env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t07-') }}
          T3_CODE_LS_MULTI_TAB_DRAFT_PROOF: ${{ env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-drafts-') }}
          T3_CODE_LS_DRAFT_STORAGE_PROOF: ${{ env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-storage-') || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-drafts-') }}
          T3_CODE_LS_FILE_EDITOR_PROOF: ${{ env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t06-file-revisions-') }}
          T3_CODE_LS_DURABLE_TEXT_PROOF: ${{ env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t03-durable-') }}
          DURABLE_BYTE_PROOF: ${{ startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t03-byte-accounting-') }}
          T3_CODE_LS_HTML_INTERACTION_PROOF: ${{ env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t13-html-') }}
          T3_CODE_LS_PDF_LINK_PROOF: ${{ env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t13-pdf-') }}
          VITE_T3_CODE_LS_COMPOSER_OFFSETS: rust
          VITE_T3_CODE_LS_DRAFT_RECONCILIATION: ${{ (env.INTEGRATED_NATIVE == 'true' || startsWith(github.ref_name, 'candidate/t3code-ls-t02-bundled-native-t11-drafts-')) && 'rust' || '' }}
        run: |
          proof="$RUNNER_TEMP/built-composer-proof"
          mkdir "$proof"
          if [[ -n "${T3_CODE_LS_PTY_PROOF_EXECUTABLE:-}" ]]; then
            sha256sum "$T3_CODE_LS_PTY_PROOF_EXECUTABLE" > "$proof/pty-host.sha256"
          fi
          node node_modules/@effect/tsgo/dist/effect-tsgo.cjs tsrs --noEmit -p tools/hybrid-client-persistence-tsconfig.json
          if [[ "$DIOXUS_COMPOSITION_PROOF" == true ]]; then
            cp -R "$RUNNER_TEMP/pairing-wasm" apps/web/public/pairing-wasm
            export VITE_T3_CODE_LS_PAIRING_RENDERER=dioxus
            export VITE_T3_CODE_LS_THREAD_FIND_RENDERER=dioxus
            export VITE_T3_CODE_LS_THREAD_LINK_RENDERER=dioxus
            export VITE_T3_CODE_LS_COMPOSER_SUBMIT_RENDERER=dioxus
            export VITE_T3_CODE_LS_APPROVAL_RENDERER=dioxus
            export VITE_T3_CODE_LS_ASSISTANT_TEXT_RENDERER=dioxus
            export VITE_T3_CODE_LS_DRAFT_RECONCILIATION=rust
          fi
          if [[ "$INTEGRATED_NATIVE" == true ]]; then
            cp -R "$RUNNER_TEMP/pairing-wasm" apps/web/public/pairing-wasm
            export VITE_T3_CODE_LS_PAIRING_RENDERER=dioxus
            export VITE_T3_CODE_LS_THREAD_FIND_RENDERER=dioxus
          fi
          if [[ "$DIOXUS_SUBMIT_PROOF" == true ]]; then
            cp -R "$RUNNER_TEMP/pairing-wasm" apps/web/public/pairing-wasm
            export VITE_T3_CODE_LS_COMPOSER_SUBMIT_RENDERER=dioxus
          fi
          if [[ "$DIOXUS_APPROVAL_PROOF" == true ]]; then
            cp -R "$RUNNER_TEMP/pairing-wasm" apps/web/public/pairing-wasm
            export VITE_T3_CODE_LS_APPROVAL_RENDERER=dioxus
          fi
          if [[ "$DIOXUS_NAVIGATION_PROOF" == true ]]; then
