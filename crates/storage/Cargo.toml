[package]
name = "t3-code-ls-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "t3-code-ls-packaged-event-accounting"
path = "src/bin/packaged-event-accounting.rs"
required-features = ["packaged-event-accounting-fixture"]

[features]
packaged-event-accounting-fixture = []
ordered-engine-fixture = ["dep:redb-bench-compare"]

[dependencies]
regex = "=1.13.1"
# omdb retains redb's package name and on-disk compatibility. Pin the fork to an
# immutable revision; never silently resolve the upstream crates.io package.
redb = { version = "=4.5.0", git = "https://github.com/glopyglerky/omdb", rev = "b2ff031398b1f0a793a352db7a699575b5d4d3d4" }
# Test-only ordered engine comparison. The application owner keeps its separate pin above.
redb-bench-compare = { git = "https://github.com/glopyglerky/omdb", rev = "efaf649fb270ce70257e53862295cc10e4bddab0", default-features = false, features = ["ordered-transactions"], optional = true }
same-file = "=1.0.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "time"] }
t3-code-ls-core = { path = "../core" }
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
getrandom = "=0.4.3"

[lints]
workspace = true
