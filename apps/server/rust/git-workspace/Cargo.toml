[workspace]
resolver = "3"

[package]
name = "t3-code-ls-git-workspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "sha256"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
