# Keep the experimental GUI resolver independent of the shipping application.
[workspace]
resolver = "3"

[package]
name = "t3-code-ls-desktop-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
gpui-base = { version = "=0.10.0", default-features = false }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["x11"] }
serde_json = "1"
t3-code-ls-client-text = { path = "../../../packages/client-runtime/rust" }

[lints.rust]
unsafe_code = "forbid"
