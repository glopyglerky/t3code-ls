[package]
name = "t3-iroh-apple"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
t3-code-ls-core = { path = "../../../../crates/core" }
t3-code-ls-transport = { path = "../../../../crates/transport" }
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi = "=0.31.1"
thiserror = "2"

[workspace]
