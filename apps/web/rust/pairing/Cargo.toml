[package]
name = "t3-code-ls-web-pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = ["hooks", "html", "macro", "signals"] }
dioxus-web = { version = "=0.8.0-alpha.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = ["AbortController", "AbortSignal", "AddEventListenerOptions", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "Location", "Node", "Window"] }

[lints]
workspace = true
