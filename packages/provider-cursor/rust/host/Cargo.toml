[package]
name = "t3-code-ls-cursor-bridge-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
t3-code-ls-cursor-bridge = { path = ".." }
tokio = { version = "=1.54.1", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true
